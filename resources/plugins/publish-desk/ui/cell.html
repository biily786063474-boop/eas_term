<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发布台 · 格子</title>
<style>
  /* 分屏里每个网页上方那条 44px 的操作条。令牌抄自 panel.html（暗 / 亮两套），改一处改两处。 */
  :root{
    --bg:#1c1c1c;--t1:#ececec;--t2:#b4b4b4;--t3:#8f8f8f;
    --lift1:rgba(255,255,255,.035);--lift2:rgba(255,255,255,.07);--lift3:rgba(255,255,255,.12);
    --wash1:rgba(0,0,0,.28);--wash2:rgba(0,0,0,.4);
    --accent:#dfe3e8;--on-accent:#0b0d12;--stroke:rgba(255,255,255,.14);
    --ok:#6ee7b7;--warn:#fcd34d;--danger:#fda4af;
    --hair:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
    --grid:rgba(255,255,255,.035);--glass:rgba(28,28,28,.72);
    --mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);--r:2px
  }
  html[data-theme="light"]{
    --bg:#ffffff;--t1:#0d0d0d;--t2:#5d5d5d;--t3:#737373;
    --lift1:rgba(0,0,0,.028);--lift2:rgba(0,0,0,.05);--lift3:rgba(0,0,0,.075);
    --wash1:rgba(0,0,0,.035);--wash2:rgba(0,0,0,.055);
    --accent:#2f3338;--on-accent:#ffffff;--stroke:rgba(0,0,0,.16);
    --ok:#0f7a4d;--warn:#8a6100;--danger:#b42318;
    --hair:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,.03));
    --grid:rgba(0,0,0,.035);--glass:rgba(255,255,255,.8)
  }
  *{box-sizing:border-box}
  html,body{height:44px;overflow:hidden}
  body{margin:0;color:var(--t1);background:transparent;font:13px/1.6 var(--sans)}
  button,input{font:inherit;color:inherit;border-radius:var(--r);transition:background-color 150ms var(--ease),color 150ms var(--ease)}
  button{cursor:pointer;background:var(--lift2);border:0;padding:2px 8px;min-height:28px;font-size:12px;color:var(--t2);white-space:nowrap;flex:none}
  button:hover{background:var(--lift3);color:var(--t1)}
  button:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
  button.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
  input{background:var(--wash1);border:1px solid var(--stroke);padding:2px 8px;min-height:28px;flex:1;min-width:60px}
  .row{height:44px;display:flex;align-items:center;gap:4px;padding:0 8px;overflow:hidden}
  .name{font-weight:600;font-size:13px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
  .grow{flex:1;min-width:0}
  .logo{flex:none;width:22px;height:22px;border-radius:var(--r);display:grid;place-items:center;background:var(--b)}
  .logo svg{width:13px;height:13px;fill:#fff}
  html:not([data-theme="light"]) .logo.dark{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .logo.mono{background:var(--lift3);color:var(--t1);font:600 11px/1 var(--mono)}
  .pill{font:600 10.5px/16px var(--mono);padding:0 6px;border-radius:var(--r);background:var(--lift2);color:var(--t3);flex:none}
  .pill.published{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
  .msg{color:var(--danger);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
  .msg.dim{color:var(--t3)}
</style>
</head>

function logo(c){const i=ICONS[c.platform];if(!i)return `<span class="logo mono" aria-hidden="true">${esc([...c.name][0])}</span>`;const dark=/^#(0|1)[0-9a-f]{5}$/i.test(i.hex)?' dark':'';return `<span class="logo${dark}" style="--b:${i.hex}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${i.d}"/></svg></span>`}
function rpc(method,params={}){return new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');setTimeout(()=>{if(pending.delete(id))reject(new Error(method+' 超时'))},30000)})}
async function tool(name,args={}){const r=await rpc('tools/call',{name,arguments:args});if(r?.isError)throw new Error(r.content?.[0]?.text||'操作失败');return r.structuredContent}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// 出错时提示挂在按钮旁边约 3 秒后自动消失，按钮一直在 —— 整条只剩一行报错会把人卡死到下一次数据通知。
// 插件已断开（sticky）与还没拿到卡片时不自动清：那时按钮本来就点不了。
function setError(msg,keep=false){error=msg;sticky=keep;clearTimeout(errorTimer);if(msg&&!keep)errorTimer=setTimeout(()=>{if(error===msg&&card&&!sticky){error='';render()}},3000)}
function fail(e,keep=false){setError(e instanceof Error?e.message:String(e),keep);render()}
window.addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return
  if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);return}
  if(m.method==='ui/notifications/tool-result'&&/^desk_(add_batch|update_card|mark|archive|lexicon)$/.test(m.params?.name||''))refresh()
  if(m.method==='notifications/resources/updated')refresh()
  if(m.method==='ui/notifications/host-context-changed'&&m.params?.theme)document.documentElement.dataset.theme=m.params.theme
  if(m.method==='ui/resource-teardown')fail('插件已断开',true)})
async function refresh(){
  try{card=(await tool('desk_list',{batchId})).batch?.cards?.find(c=>c.platform===platform)||null;if(!sticky)setError('')}catch(e){if(!sticky)setError(e instanceof Error?e.message:String(e))}
  if(!marking||error)render() // 填链接时别重绘，会冲掉输入框里已敲的字
}
const btn=(k,label)=>`<button type="button" data-copy="${k}">${flashKey===k?'已复制':label}</button>`
function render(){
  const row=document.getElementById('row')
  const alert=error?`<span class="msg" role="alert" title="${esc(error)}">${esc(error)}</span>`:''
  if(!card||sticky){row.innerHTML=alert||'<span class="msg dim">找不到这个平台的卡片</span>';return}
  const c=card,pub=c.status==='published'
  const right=marking
    ?`<input id="url" type="url" placeholder="帖子链接（可不填）" aria-label="发布链接"><button type="button" class="primary" data-confirm>确认</button><button type="button" data-cancel>取消</button>`
    :(c.title?btn('title','复制标题'):'')+(c.body?btn('body','复制正文'):'')+(c.tags?.length?btn('tags','复制标签'):'')+(pub?'<span class="pill published">已发布</span>':'<button type="button" class="primary" data-marking>标记已发布</button>')
  row.innerHTML=`${logo(c)}<span class="name">${esc(c.name)}</span>${marking?'':'<span class="grow"></span>'}${alert}${right}`
  if(marking)document.getElementById('url')?.focus()
}
function copyText(what){return what==='tags'?card.tagsText:card[what]}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!card)return
  const d=b.dataset
  // 剪贴板要在点击当下就发请求：宿主靠「真实点击」放行，拖到 await 之后可能已过期
  if(d.copy){const k=d.copy;rpc('panel/clipboard.write',{text:copyText(k)}).then(()=>{flashKey=k;render();setTimeout(()=>{if(flashKey===k){flashKey=null;render()}},1500)}).catch(fail);return}
  if('marking' in d){marking=true;render();return}
  if('cancel' in d){marking=false;render();return}
  if('confirm' in d){const url=document.getElementById('url')?.value.trim()||undefined;marking=false;tool('desk_mark',{batchId,platform,status:'published',...(url?{url}:{})}).then(refresh).catch(fail)}
})
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='url')document.querySelector('[data-confirm]')?.click();if(e.key==='Escape'&&marking){marking=false;render()}})
;(async()=>{try{
  const init=await rpc('ui/initialize',{appInfo:{name:'publish-desk-cell',version:'0.1.2'},appCapabilities:{},protocolVersion:'2026-01-26'})
  if(init?.hostContext?.theme)document.documentElement.dataset.theme=init.hostContext.theme
  const p=init?.hostContext?._meta?.eas?.context?.params||{};batchId=p.batchId;platform=p.platform
  parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*')
  await refresh()
}catch(e){fail(e)}})()
</script>
</body>
</html>
