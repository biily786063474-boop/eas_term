function context(h){const c=h?._meta?.eas?.context?.cwd;if(typeof c==='string'&&c!==hostCwd){hostCwd=c;generation++;detailGeneration++;items=[];days={};selected=0;changeView('month');$('.project').textContent=globalState?'全局足迹':c.split(/[\\/]/).filter(Boolean).pop()||'当前项目'}}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const m=e.data,p=pending.get(m.id);if(p){clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result'&&['timeline_record','timeline_capture'].includes(m.params?.name)&&!m.params?.result?.isError)refresh();if(m.method==='ui/notifications/host-context-changed'){context(m.params);refresh()}if(m.method==='ui/resource-teardown'){ready=false;generation++;detailGeneration++;status('时间线连接已断开，请重开插件面板',true)}})
function changeView(v,focus){view=v;app.dataset.view=v;for(const name of ['month','day','detail']){const el=$(name==='detail'?'.detail-view':'.'+name);el.inert=name!==v;el.setAttribute('aria-hidden',name!==v)}focus?.focus({preventScroll:true})}
function calendar(){const root=$('#calendar');root.replaceChildren();['一','二','三','四','五','六','日'].forEach(n=>{const el=document.createElement('span');el.className='weekday';el.textContent=n;root.append(el)});for(let i=0;i<(new Date(year,month,1).getDay()+6)%7;i++){const el=document.createElement('div');el.className='blank';root.append(el)}for(let d=1;d<=new Date(year,month+1,0).getDate();d++){const key=monthKey()+'-'+pad(d),n=days[key]||0,b=document.createElement('button');b.className='cell'+(key===today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate())?' today':'');b.style.setProperty('--heat',palette[n===0?0:n<=2?1:n<=4?2:n<=6?3:4]);b.innerHTML='<span class="num">'+d+'</span><span class="amount">'+(n?n+' 项':'—')+'</span>';b.dataset.day=d;b.setAttribute('aria-label',key+'，'+n+'项成果');b.onclick=async()=>{const r=b.getBoundingClientRect(),base=$('.month').getBoundingClientRect();$('.month').style.setProperty('--ox',(r.left+r.width/2-base.left)/base.width*100+'%');$('.month').style.setProperty('--oy',(r.top+r.height/2-base.top)/base.height*100+'%');day=d;selected=0;$('#query').value='';items=[];renderDay();changeView('day',$('#dial'));await loadDay()};root.append(b)}$('#monthTitle').textContent=pad(month+1)+' 月';$('#yearLabel').textContent=year;$('#monthSummary').textContent=Object.keys(days).length+' 个有成果的日子 · '+Object.values(days).reduce((a,b)=>a+b,0)+' 项里程碑';$('#prevMonth').disabled=year<=1970&&month===0;$('#nextMonth').disabled=year>=2100&&month===11}
async function loadMonth(){const token=++generation;status('读取月份…');try{const r=await tool(globalState?'timeline_global_list':'timeline_list',{month:monthKey(),limit:1,...(globalState?{projectIds}:{})});if(token!==generation)return;days=r.days;calendar();status((globalState?'全局 · 本地保存 · ':'项目内保存 · ')+monthKey()+(r.partial?' · 部分项目不可读：'+r.errors.map(e=>e.projectName).join('、'):''),r.partial)}catch(e){if(token===generation){status(e.message,true);days={};$('#calendar').replaceChildren();$('#monthSummary').textContent='读取失败，请刷新；原数据未改动'}}}
async function loadDay(more=false){const token=++generation,id=items[selected]?.id,project=items[selected]?.projectId;status('读取当天成果…');try{const r=await tool(globalState?'timeline_global_list':'timeline_list',{...(globalState?{projectIds}:{}),date:dayKey(),query:$('#query').value.trim(),limit:100,offset:more?(nextOffset||0):0});if(token!==generation)return;items=more?items.concat(r.items):r.items;total=r.total;nextOffset=r.nextOffset;selected=Math.max(0,items.findIndex(x=>x.id===id&&x.projectId===project));renderDay();status((globalState?'全局 · ':'项目内保存 · ')+total+' 项成果'+(r.partial?' · 部分项目不可读':''),r.partial);if(view==='detail'&&items.length)await showDetail()}catch(e){if(token===generation){status(e.message,true);items=[];renderDay();$('#wheel').textContent='读取失败，请刷新；未清空原数据'}}}
function renderDay(){const root=$('#wheel');root.replaceChildren();$('#dayTag').textContent='DAY '+pad(day)+' / '+new Date(year,month+1,0).getDate();$('#dateLabel').textContent=year+' 年 '+(month+1)+' 月 '+day+' 日';if(!items.length){const d=document.createElement('div');d.className='empty-day';d.innerHTML='<h2>这一天，留白。</h2><p>暂无匹配成果。完成一个阶段后，让 AI 记录到时间线。</p>';root.append(d)}items.forEach((r,i)=>{const b=document.createElement('button');b.className='wheel-item';b.innerHTML='<time></time><span class="mark"></span><span class="title"></span><span class="enter">↗</span>';b.querySelector('time').textContent=new Date(r.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});const title=document.createElement('span');title.className='wheel-title';title.textContent=r.title;b.querySelector('.title').append(title);if(r.projectName){const tag=document.createElement('small');tag.className='project-tag';tag.textContent=r.projectName;b.querySelector('.title').append(tag);}b.setAttribute('aria-label',r.title+'，选择后再次点击查看详情');b.onclick=()=>i===selected?showDetail():select(i);root.append(b)});$('#more').hidden=nextOffset===null;position()}
function position(){document.querySelectorAll('.wheel-item').forEach((b,i)=>{const d=i-selected,a=Math.abs(d);b.style.setProperty('--x',(-(Math.min(a,5)**2)*12)+'px');b.style.setProperty('--y',d*(innerHeight<550?55:80)+'px');b.style.setProperty('--tilt',d*2.5+'deg');b.style.setProperty('--blur',a*2+'px');b.style.setProperty('--opacity',Math.max(0,1-a*.25));b.style.setProperty('--pointer',a>3?'none':'auto');b.setAttribute('aria-current',i===selected);b.tabIndex=a>3?-1:0});$('#position').textContent=items.length?pad(selected+1):'00';$('#total').textContent='/ '+total+' 项';$('#up').disabled=selected===0||!items.length;$('#down').disabled=selected>=items.length-1;$('.center-rule').hidden=!items.length;$('.ambient-halo').hidden=!items.length}function select(i){selected=Math.max(0,Math.min(items.length-1,i));position()}
async function showDetail(){const ref=items[selected];if(!ref)return;const token=++detailGeneration;status('读取成果详情…');try{const r=await tool(globalState?'timeline_global_get':'timeline_get',{id:ref.id,...(globalState?{projectId:ref.projectId}:{})});if(token!==detailGeneration||(items[selected]?.id!==ref.id||items[selected]?.projectId!==ref.projectId))return;$('#detailDate').textContent=r.date;$('#taskNumber').textContent='MILESTONE / '+pad(selected+1);$('#taskTitle').textContent=r.title;$('#taskState').textContent=({pending:'待验证 / 待验收',verified:'已验证',accepted:'已验收'})[r.status];$('#taskTime').textContent=new Date(r.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#taskAuthor').textContent=(r.projectName?r.projectName+' · ':'')+r.author+' 写入';$('#taskDescription').textContent=r.summary;$('#taskProof').replaceChildren();[...r.evidence,...r.artifacts.map(x=>'成果：'+x)].forEach(t=>{const p=document.createElement('p');p.textContent=t;$('#taskProof').append(p)});if(!r.evidence.length&&!r.artifacts.length)$('#taskProof').textContent='尚未附验证依据或成果位置';$('#taskSource').textContent='标识：'+r.taskKey+' · 更新于 '+new Date(r.updatedAt).toLocaleString();$('#previousTask').disabled=selected===0;$('#nextTask').disabled=selected===items.length-1;changeView('detail',$('#toDay'));status('项目内保存 · '+r.date)}catch(e){if(token===detailGeneration)status(e.message,true)}}
$('#weeklyReport').onclick=async()=>{const b=$('#weeklyReport');b.disabled=true;status('正在汇总成果周报…');try{await rpc('panel/timeline-report',{week:Number($('#reportWeek').value),projectIds});status('成果周报已打开 · 本地生成')}catch(e){status(e.message,true)}finally{b.disabled=false}};
async function refresh(){if(!ready)return;if(globalState){try{globalState=await rpc('panel/state',{});renderGlobal();await candidateCount()}catch(e){status(e.message,true)}}if(view==='month')await loadMonth();else await loadDay()}
$('#toMonth').onclick=()=>{detailGeneration++;changeView('month',$('#prevMonth'));loadMonth()};$('#toDay').onclick=()=>{detailGeneration++;changeView('day',$('#dial'))};$('#prevMonth').onclick=()=>{const d=new Date(year,month-1,1);year=d.getFullYear();month=d.getMonth();loadMonth()};$('#nextMonth').onclick=()=>{const d=new Date(year,month+1,1);year=d.getFullYear();month=d.getMonth();loadMonth()};$('#up').onclick=()=>select(selected-1);$('#down').onclick=()=>select(selected+1);$('#previousTask').onclick=()=>{select(selected-1);showDetail()};$('#nextTask').onclick=()=>{select(selected+1);showDetail()};$('#more').onclick=()=>loadDay(true);let searchTimer;$('#query').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadDay(),250)};$('#refresh').onclick=refresh;$('#dial').onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();select(selected+(e.key==='ArrowDown'?1:-1))}else if(e.key==='Enter'&&e.target===$('#dial'))showDetail()};let lastWheel=0;$('#dial').addEventListener('wheel',e=>{if(!items.length)return;e.preventDefault();if(Math.abs(e.deltaY)<5||Date.now()-lastWheel<240)return;lastWheel=Date.now();select(selected+Math.sign(e.deltaY))},{passive:false});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#backfillDialog').open&&!$('#globalDialog').open){if(view==='detail')$('#toDay').click();else if(view==='day')$('#toMonth').click()}});$('#motionToggle').onclick=()=>{const on=app.classList.toggle('motion-pause');$('#motionToggle').setAttribute('aria-pressed',on);$('#motionToggle').textContent=on?'恢复动态效果':'减少动态效果'};$('#backfill').onclick=()=>{$('#backfillDialog').showModal();$('#backfillDialog textarea').select()};$('#closeBackfill').onclick=()=>$('#backfillDialog').close();window.addEventListener('resize',position);

async function candidateCount(){try{const r=await tool('timeline_candidates',{projectIds});$('#candidateButton').textContent='待确认'+(r.total?' · '+r.total:'');if(r.partial)globalState.error='部分项目候选不可读'}catch(e){globalState.error=e.message}}
function renderGlobal(){if(!globalState)return;$('.project').textContent='全局足迹';$('#captureToggle').textContent=globalState.enabled?'● 全局记录中':'○ 开启全局记录';$('#captureToggle').setAttribute('aria-pressed',globalState.enabled);$('#projectFilter').textContent=projectIds===undefined?'全部项目 ▾':projectIds.length+' 个项目 ▾'}
async function initGlobal(){try{const r=await rpc('panel/state',{});if(r.protocol!==1)throw Error('宿主不支持全局事件');globalState=r;renderGlobal();await candidateCount();if(r.error)status(r.error,true)}catch(e){for(const id of ['projectFilter','candidateButton','captureScope','captureToggle'])$('#'+id).disabled=true;$('#captureToggle').textContent='需更新宿主';status('当前宿主不支持全局记录，保留项目模式',true)}}
function openGlobal(title,description){$('#globalDialogTitle').textContent=title;$('#globalDialogDescription').textContent=description;$('#globalDialogBody').replaceChildren();$('#globalDialogSave').hidden=false;$('#globalDialogClose').textContent='取消';$('#globalDialog').showModal()}
$('#globalDialogClose').onclick=()=>$('#globalDialog').close();
function guardedSave(fn){$('#globalDialogSave').onclick=async()=>{const b=$('#globalDialogSave');b.disabled=true;try{await fn();$('#globalDialog').close();renderGlobal();await refresh()}catch(e){$('#globalDialogDescription').textContent=e.message}finally{b.disabled=false}}}
$('#captureToggle').onclick=()=>{if(!globalState)return;const enabling=!globalState.enabled;openGlobal(enabling?'开启全局记录':'暂停全局记录',enabling?'覆盖所有已登记及未来新增项目中的托管 AI 对话（含已打开的对话）。仅读取完成轮次的末尾摘要，在本机生成待确认候选；不调用额外模型，不读取历史。敏感项目请在「范围」中排除。':'停止接收新的完成事件；已保存的里程碑和候选不会删除。');guardedSave(async()=>{globalState=await rpc(enabling?'panel/grant':'panel/revoke',{})})};
function projectChoices(mode){if(!globalState)return;const filter=mode==='filter';openGlobal(filter?'按项目查看':'全局记录范围',filter?'只改变当前视图，不影响后台记录；全部未选时显示空结果。':'勾选的项目允许记录和全局读取。未列出的未来新增项目默认允许；取消勾选可排除敏感项目。');const box=document.createElement('div');box.className='scope-list';for(const p of globalState.projects){if(filter&&globalState.excluded.includes(p.id))continue;const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=p.id;input.checked=filter?(projectIds===undefined||projectIds.includes(p.id)):!globalState.excluded.includes(p.id);label.append(input,document.createTextNode(p.name));box.append(label)}$('#globalDialogBody').append(box);guardedSave(async()=>{const inputs=[...box.querySelectorAll('input')];if(filter){const chosen=inputs.filter(x=>x.checked).map(x=>x.value);projectIds=chosen.length===inputs.length?undefined:chosen;detailGeneration++;changeView('month')}else{globalState=await rpc(globalState.enabled?'panel/grant':'panel/revoke',{excluded:inputs.filter(x=>!x.checked).map(x=>x.value)});projectIds=undefined;detailGeneration++;changeView('month')}})}
$('#projectFilter').onclick=()=>projectChoices('filter');$('#captureScope').onclick=()=>projectChoices('scope');
$('#candidateButton').onclick=async()=>{openGlobal('待确认候选','本地规则发现的可能成果，不代表已验证，不计入热力图。收录后为「待验证」，忽略后不再提示。');$('#globalDialogSave').hidden=true;$('#globalDialogClose').textContent='关闭';try{const r=await tool('timeline_candidates',{projectIds});const body=$('#globalDialogBody');if(r.total>50||r.partial)$('#globalDialogDescription').textContent+=' 当前显示前 50 条；'+(r.partial?'部分项目不可读。':'共 '+r.total+' 条。');if(!r.items.length)body.textContent='暂无候选。开启全局记录后，符合条件的完成轮次会出现在这里。';for(const c of r.items){const row=document.createElement('section');row.className='candidate';const title=document.createElement('strong'),meta=document.createElement('small'),summary=document.createElement('p');title.textContent=c.title;meta.textContent=c.projectName+' · '+c.date;summary.textContent=c.summary;row.append(meta,document.createElement('br'),title,summary);if(c.jev?.requiresReview){const note=document.createElement('p');note.className='jev-suggestion';const parts=['Jev 辅助建议 · 仍需人工复核'];if(c.jev.milestone)parts.push('值得保留的判断概率 '+Math.round(c.jev.milestone.probability*100)+'%（不是验收通过率）');if(c.jev.project){const project=globalState?.projects?.find(p=>p.id===c.jev.project.projectId);parts.push('项目标签建议：'+(project?.name??'不确定或项目已不可用')+'；不会自动移动记录')}note.textContent=parts.join(' · ');row.append(note)}for(const [decision,label] of [['confirm','收录为待验证'],['ignore','忽略']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{for(const x of row.querySelectorAll('button'))x.disabled=true;try{await rpc('panel/resolve-candidate',{projectId:c.projectId,id:c.id,decision});row.remove();await refresh()}catch(e){summary.textContent=e.message;for(const x of row.querySelectorAll('button'))x.disabled=false}};row.append(b)}body.append(row)}}catch(e){$('#globalDialogBody').textContent=e.message}};

(async()=>{try{const r=await rpc('ui/initialize',{appInfo:{name:'timeline',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'});context(r.hostContext);parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');ready=true;await initGlobal();changeView('month');await loadMonth()}catch(e){status('连接失败：'+e.message,true)}})()
</script></body></html>
