<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06070b">
<!-- 纯内联、零外部依赖，所以能收得很紧：只允许连自己（/api），图片只有 data: URL。
     `unsafe-inline` 是内联样式和脚本必需的；页面里所有内容都走 textContent 塞，
     从不把服务端返回的字符串当 HTML 解析 —— 这是这条豁免能成立的前提。 -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Eas-Term</title>
<style>
/* 直接用桌面端 base.css 的那套 token，不另起一套 —— 手机端要跟 app 是同一个东西 */
:root{
  --accent:#a2b9e0; --accent-rgb:162,185,224;
  --fg:#e2e4ea; --fg-dim:#969aa8; --fg-mute:#6d7280;
  --glass-1:rgba(15,17,23,.5); --glass-2:rgba(11,13,19,.62); --glass-3:rgba(25,28,38,.82);
  --gb:rgba(255,255,255,.09); --gbs:rgba(255,255,255,.14);
  --hl:inset 0 1px 0 rgba(255,255,255,.07);
  --r-xl:18px; --r-lg:14px; --r-md:10px; --r-sm:7px;
  --ok:#7ee0b8; --warn:#f5a623; --idle:#3a3f4c; --danger:#f78b96;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(165deg,rgba(7,8,13,.72),rgba(3,4,6,.85)),#06070b;
  color:var(--fg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none}
#hd{flex:none;padding:calc(var(--safe-t) + 14px) 16px 10px}
#h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
#h2{font-size:12px;color:var(--fg-dim);margin-top:3px}
#back{display:none;font-size:13px;color:var(--accent);margin-bottom:8px;cursor:pointer}
#back.on{display:block}
#conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-dim);
  padding:5px 11px;border-radius:var(--r-xl);background:var(--glass-2);border:1px solid var(--gb);
  margin:8px 16px 0}
#body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
#nav{flex:none;display:flex;border-top:1px solid var(--gb);background:var(--glass-1);
  backdrop-filter:blur(14px);padding-bottom:var(--safe-b)}
#nav button{flex:1;background:none;border:0;color:var(--fg-dim);font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;padding:9px 0 8px;cursor:pointer;min-height:52px}
#nav button.on{color:var(--accent)}
#nav svg{display:block}
.card{background:var(--glass-2);border:1px solid var(--gb);box-shadow:var(--hl);
  border-radius:var(--r-lg);padding:12px 13px;margin-bottom:9px;cursor:pointer;
  transition:background .15s;min-height:44px}
.card:active{background:var(--glass-3)}
.card.flat{cursor:default}
.row{display:flex;align-items:center;gap:9px}
.nm{font-size:14px;font-weight:550;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11.5px;color:var(--fg-dim);margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(126,224,184,.14)}
.dot.wait{background:var(--warn);box-shadow:0 0 0 3px rgba(245,166,35,.14)}
.dot.off{background:var(--idle)}
.chip{font-size:10px;padding:2px 7px;border-radius:var(--r-sm);flex:none;font-weight:600;
  background:rgba(var(--accent-rgb),.16);color:var(--accent)}
.chip.g{background:rgba(255,255,255,.05);color:var(--fg-dim);font-weight:500}
.grp{font-size:11px;color:var(--fg-mute);padding:8px 3px 6px;letter-spacing:.03em}
.empty{text-align:center;color:var(--fg-dim);font-size:13px;padding:56px 24px;line-height:1.8}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px;font-weight:600}
pre{margin:0;padding:14px;background:var(--glass-2);border:1px solid var(--gb);
  border-radius:var(--r-lg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
img.doc{width:100%;border-radius:var(--r-lg);border:1px solid var(--gb);display:block}
.warnbar{font-size:11.5px;color:var(--warn);background:rgba(245,166,35,.1);
  border:1px solid rgba(245,166,35,.22);border-radius:var(--r-md);padding:8px 11px;margin-bottom:10px}
input,button.big{width:100%;font-family:inherit;font-size:15px;padding:13px 14px;
  border-radius:var(--r-lg);border:1px solid var(--gb);background:var(--glass-3);color:var(--fg)}
button.big{background:var(--accent);color:#0b0d13;font-weight:650;border:0;margin-top:10px;cursor:pointer}
button.big:disabled{opacity:.45}
.pair{padding:26px 6px}
.pair h3{font-size:19px;margin:0 0 6px;font-weight:650}
.pair p{font-size:13px;color:var(--fg-dim);margin:0 0 18px;line-height:1.7}
.err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:18px}

/* ── 对话（第二步）──────────────────────────────────────────
   气泡沿用规格里那几张样机：自己发的靠右、贴主色；agent 的靠左、玻璃底。
   **底部要给输入条让位** —— 不然最后一条永远压在输入框下面看不全。 */
.why{font-size:11px;color:var(--fg-mute);margin-top:5px;line-height:1.5}
.sending{position:fixed;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:11.5px;color:var(--accent);pointer-events:none}
.term{margin:0;padding:11px 12px 74px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;color:var(--fg-dim)}
.chat{display:flex;flex-direction:column;gap:9px;padding-bottom:74px}
.bub{max-width:82%;padding:9px 12px;border-radius:var(--r-lg);font-size:14px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:rgba(var(--accent-rgb),.16);
  border:1px solid rgba(var(--accent-rgb),.3);border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--glass-2);border:1px solid var(--gb);
  border-bottom-left-radius:6px}
/* 吸底输入条。fixed 而不是 sticky —— 手机上滚动容器的 sticky 在某些浏览器里会跳。
   env(safe-area-inset-bottom) 是给全面屏底部那条 home 指示器让位的 */
.composer{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;align-items:flex-end;padding:9px 14px;
  background:rgba(12,13,17,.94);backdrop-filter:blur(12px);border-top:1px solid var(--gb)}
.composer textarea{flex:1;font-family:inherit;font-size:15px;line-height:1.5;padding:10px 12px;
  border-radius:18px;border:1px solid var(--gb);background:var(--glass-3);color:var(--fg);
  resize:none;max-height:120px;overflow-y:auto}
.composer textarea:focus{outline:none;border-color:rgba(var(--accent-rgb),.55)}
/* 44px 是触控目标下限（规格里写死的） */
.send{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:0;
  background:rgba(var(--accent-rgb),.9);color:#0c0d11;display:flex;align-items:center;
  justify-content:center;cursor:pointer}
.send.busy{opacity:.5}
.send svg{width:19px;height:19px}
</style></head><body>

<div id="hd"><div id="back">‹ 返回</div><h1 id="h1">项目</h1><div id="h2"></div></div>
<div id="conn" hidden><span class="dot on"></span><span id="connt">局域网直连</span></div>
<div id="body"></div>
<nav id="nav" hidden></nav>

<script>
// **整段包在 IIFE 里，一个全局都不留。**
// 不只是洁癖：真机验证时撞到了 —— 这个页面被 Electron 主窗口打开时，
// 那个窗口的 preload 已经把 `window.api` 挂上了，顶层 `function api()`
// 当场 SyntaxError，整个脚本一行都没执行（页面只剩静态骨架）。
// 手机浏览器里不会有 preload，但「不往全局撒东西」本来就该是默认。
;(function () {
'use strict'
// 手机端。**不引任何框架** —— 四个视图、五个接口，原生 DOM 写得完；
// 引 React 反而要处理构建产物怎么随包发出去。
// **不缓存任何内容**（规格红线）：每次进视图都重新拉，断线就是空白。

var TK = 'eas.phone.token'
var token = null
try { token = localStorage.getItem(TK) } catch (e) { /* 隐私模式下会抛 */ }
var view = 'live', proj = null, projName = ''
// 当前打开的对话（第二步）。sess 非空时 view==='chat'
var sess = null, sessName = '', sessRunning = false, sessNode = null, sessKind = 'agent'
// 这个会话此刻在不在跑（由 transcript 接口带回来）。轮询靠它决定停不停
var chatBusy = null

var $ = function (id) { return document.getElementById(id) }
var el = function (t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e }

// ── 网络 ────────────────────────────────────────────────────
function call (action, args) {
  return fetch('/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ action: action, args: args || {} })
  }).then(function (r) {
    // **401 一律当「要重新配对」** —— 服务端故意不区分「token 错」和「被吊销」，
    // 因为用户的动作是同一个：重新扫码
    if (r.status === 401) { forgetToken(); throw new Error('unauthorized') }
    return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j })
  })
}
function forgetToken () { token = null; try { localStorage.removeItem(TK) } catch (e) {} render() }

// ── 图标 ────────────────────────────────────────────────────
var ICON = {
  live: 'M12 2a10 10 0 1 0 10 10M12 6v6l4 2',
  projects: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  sessions: 'M21 12a8 8 0 0 1-8 8H4l2.3-2.3A8 8 0 1 1 21 12z',
  files: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5'
}
function svg (d) {
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', '17'); s.setAttribute('height', '17')
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor')
  s.setAttribute('stroke-width', '1.7'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round')
  var p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  p.setAttribute('d', d); s.appendChild(p); return s
}

// ── 配对 ────────────────────────────────────────────────────
function renderPair (msg) {
  $('nav').hidden = true; $('conn').hidden = true; $('back').className = ''
  $('h1').textContent = '连接你的电脑'; $('h2').textContent = ''
  var b = $('body'); b.innerHTML = ''
  var w = el('div', 'pair')
  w.appendChild(el('h3', null, '输入电脑上的配对码'))
  w.appendChild(el('p', null, '在电脑上打开 Eas-Term → 设置 → 手机端，把那六位码输进来。码 60 秒后失效。'))
  var inp = el('input'); inp.placeholder = '六位配对码'; inp.autocapitalize = 'characters'
  inp.autocomplete = 'off'; inp.maxLength = 6
  // 扫码进来的地址带着 ?c=ABC123 —— 直接填上，用户不用手打。
  // **仍然只是填，不自动提交**：提交之后要在电脑上点允许，
  // 让用户看清自己要连的是哪台再按，比一进来就开始轮询更清楚。
  var fromQr = (location.search.match(/[?&]c=([A-Z0-9]{4,8})/i) || [])[1]
  if (fromQr) inp.value = fromQr.toUpperCase()
  var btn = el('button', 'big', '连接'); btn.disabled = inp.value.length !== 6
  var err = el('div', 'err', msg || '')
  inp.addEventListener('input', function () {
    inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '')
    btn.disabled = inp.value.length !== 6
  })
  btn.addEventListener('click', function () {
    btn.disabled = true; btn.textContent = '等电脑上点允许…'; err.textContent = ''
    fetch('/pair', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: inp.value, name: deviceName() })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j } }) })
      .then(function (r) {
        if (!r.ok) throw new Error(PAIR_ERR[r.j.error] || r.j.error)
        poll(0)
      })
      .catch(function (e) { btn.disabled = false; btn.textContent = '连接'; err.textContent = e.message })
    // 轮询等电脑上点「允许」。**扫到码不等于配上** —— 那道人工确认是整套配对的重点
    function poll (n) {
      if (n > 120) { btn.disabled = false; btn.textContent = '连接'; err.textContent = '等太久了，请重试'; return }
      fetch('/pair/wait').then(function (r) { return r.json() }).then(function (j) {
        if (j.token) {
          token = j.token
          try { localStorage.setItem(TK, token) } catch (e) {}
          view = 'projects'; render(); return
        }
        setTimeout(function () { poll(n + 1) }, 1000)
      }).catch(function () { setTimeout(function () { poll(n + 1) }, 1500) })
    }
  })
  w.appendChild(inp); w.appendChild(btn); w.appendChild(err)
  b.appendChild(w)
  setTimeout(function () { inp.focus() }, 120)
}
var PAIR_ERR = {
  'no-pending': '电脑上还没打开配对 —— 去设置 → 手机端点一下',
  'bad-code': '码不对，再看一眼电脑上那六位',
  'expired': '这张码过期了，在电脑上换一张'
}
function deviceName () {
  var ua = navigator.userAgent
  if (/iPhone/.test(ua)) return 'iPhone'
  if (/iPad/.test(ua)) return 'iPad'
  if (/Android/.test(ua)) return 'Android 手机'
  return '手机'
}

// ── 四个视图 ────────────────────────────────────────────────
function shell (title, sub, backTo) {
  $('h1').textContent = title
  $('h2').textContent = sub || ''
  $('back').className = backTo ? 'on' : ''
  $('back').onclick = backTo ? function () { view = backTo; render() } : null
  $('conn').hidden = false
  var n = $('nav'); n.hidden = false; n.innerHTML = ''
  ;[['live', '动态'], ['projects', '项目'], ['sessions', '会话'], ['files', '文件']].forEach(function (t) {
    var b = el('button', view === t[0] ? 'on' : '')
    b.appendChild(svg(ICON[t[0]])); b.appendChild(el('span', null, t[1]))
    b.onclick = function () {
      // 会话和文件都要先选项目 —— 没选就退回项目列表，不给一个空页
      if ((t[0] === 'sessions' || t[0] === 'files') && !proj) { view = 'projects' } else { view = t[0] }
      render()
    }
    n.appendChild(b)
  })
  var b = $('body'); b.innerHTML = ''; return b
}

function loading (b) { b.appendChild(el('div', 'empty', '正在读…')) }
function fail (b, e) {
  var d = el('div', 'empty')
  d.appendChild(el('b', null, e === 'unauthorized' ? '授权失效了' : '连不上你的电脑'))
  d.appendChild(document.createTextNode(
    e === 'unauthorized' ? '请重新配对' : '确认电脑开着 Eas-Term，而且手机和它在同一个 Wi-Fi'))
  b.appendChild(d)
}

/** 动态：一屏回答「现在怎么样了」。
 *
 *  三段的顺序按**「要不要你现在动手」**排，不按时间：
 *  等你处理 → 正在跑 → 刚完成。
 *  「等你」排最前是因为它是唯一会**卡住**的状态 —— agent 停在那儿等一句话。
 *
 *  quiet=true 时不显示「正在读…」：自动刷新每 5 秒来一次，
 *  每次都闪一下「正在读」会让人以为它在反复出错。 */
function renderLive (quiet) {
  var b = shell('动态', '', null)
  if (!quiet) loading(b)
  call('status').then(function (r) {
    b.innerHTML = ''
    var d = r.data || { waiting: [], running: [], finished: [] }
    var w = d.waiting.length, g = d.running.length
    $('h2').textContent = w || g
      ? (w ? w + ' 个等你处理' : '') + (w && g ? ' · ' : '') + (g ? g + ' 个在跑' : '')
      : '现在没有在跑的'

    if (w) {
      b.appendChild(el('div', 'grp', '等你处理'))
      d.waiting.forEach(function (x) { b.appendChild(liveCard(x, 'wait')) })
    }
    if (g) {
      b.appendChild(el('div', 'grp', '正在跑'))
      d.running.forEach(function (x) { b.appendChild(liveCard(x, 'on')) })
    }
    if (!w && !g) {
      var e = el('div', 'empty')
      e.appendChild(el('b', null, '都停下了'))
      e.appendChild(document.createTextNode('没有正在跑的会话，也没有等你处理的'))
      b.appendChild(e)
    }
    if (d.finished.length) {
      b.appendChild(el('div', 'grp', '刚完成'))
      d.finished.forEach(function (f) {
        var c = el('div', 'card flat')
        var row = el('div', 'row')
        row.appendChild(el('span', 'dot off'))
        row.appendChild(el('span', 'nm', f.prompt))
        row.appendChild(el('span', 'chip g', ago(f.endAt)))
        c.appendChild(row)
        c.appendChild(el('div', 'sub', f.projectName + ' · 用了 ' + dur(f.durationMs)))
        b.appendChild(c)
      })
    }
    startPoll(function () { renderLive(true) })
  }).catch(function (e) { b.innerHTML = ''; fail(b, e.message) })
}

function liveCard (x, state) {
  var c = el('div', 'card')
  var row = el('div', 'row')
  row.appendChild(el('span', 'dot ' + state))
  row.appendChild(el('span', 'nm', x.title))
  row.appendChild(el('span', 'chip g', x.kind === 'agent' ? '对话' : '终端'))
  c.appendChild(row)
  c.appendChild(el('div', 'sub', x.projectName))
  // 点它跳到那个项目的会话列表 —— 「谁在跑」看完自然想看「它在干嘛」
  c.onclick = function () { proj = x.projectId; projName = x.projectName; view = 'sessions'; render() }
  return c
}

/** 「3 分钟前」。**到分钟就够** —— 手机上问的是「刚才还是很久以前」 */
function ago (t) {
  var s = Math.max(0, Math.floor((Date.now() - t) / 1000))
  if (s < 60) return '刚刚'
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前'
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前'
  return Math.floor(s / 86400) + ' 天前'
}
function dur (ms) {
  var m = Math.round(ms / 60000)
  if (m < 1) return Math.max(1, Math.round(ms / 1000)) + ' 秒'
  if (m < 60) return m + ' 分钟'
  return Math.floor(m / 60) + ' 小时' + (m % 60 ? (m % 60) + ' 分' : '')
}

function renderProjects () {
  var b = shell('项目', '', null); loading(b)
  call('projects').then(function (r) {
    b.innerHTML = ''
    var d = r.data || []
    $('h2').textContent = d.length + ' 个在画布上'
    if (!d.length) { b.appendChild(el('div', 'empty', '画布上还没有项目')); return }
    d.forEach(function (p) {
      var c = el('div', 'card')
      var row = el('div', 'row')
      row.appendChild(el('span', 'dot ' + (p.waiting ? 'wait' : p.running ? 'on' : 'off')))
      row.appendChild(el('span', 'nm', p.name))
      if (p.waiting) row.appendChild(el('span', 'chip', '等你'))
      else if (p.running) row.appendChild(el('span', 'chip', p.running + ' 在跑'))
      c.appendChild(row)
      c.appendChild(el('div', 'sub', p.sessions ? p.sessions + ' 个会话' : '没有会话'))
      c.onclick = function () { proj = p.id; projName = p.name; view = 'sessions'; render() }
      b.appendChild(c)
    })
  }).catch(function (e) { b.innerHTML = ''; fail(b, e.message) })
}

function renderSessions () {
  var b = shell(projName, '', 'projects'); loading(b)
  call('sessions', { projectId: proj }).then(function (r) {
    b.innerHTML = ''
    var d = r.data || []
    var run = d.filter(function (s) { return s.running }).length
    $('h2').textContent = d.length + ' 个会话 · ' + run + ' 个在跑'
    // 能点进去的是「AI 对话 + 已经起过进程」的那些（见下面卡片上的判断）。
    // 终端进不去 —— 协议上没有给终端发消息这条路。
    if (!d.length) {
      var e = el('div', 'empty')
      e.appendChild(el('b', null, '这个项目还没有会话'))
      e.appendChild(document.createTextNode('可以从这里新建一个 —— 要在电脑上点一次允许'))
      b.appendChild(e)
      b.appendChild(newSessionBtn())
      return
    }
    d.forEach(function (s) {
      var c = el('div', 'card flat')
      var row = el('div', 'row')
      row.appendChild(el('span', 'dot ' + (s.waiting ? 'wait' : s.running ? 'on' : 'off')))
      row.appendChild(el('span', 'nm', s.title))
      row.appendChild(el('span', 'chip g', s.kind === 'agent' ? '对话' : '终端'))
      c.appendChild(row)
      // **「还没启动」和「空闲」是两回事** —— 前者是刚建出来还没聊过，
      // 后者是聊过但现在没在跑。混成一个词会让人以为新建的那个坏了
      c.appendChild(el('div', 'sub',
        s.waiting ? '等你处理' : s.running ? '在跑' : s.started ? '空闲' : '还没启动'))
      // **点不了的要说清为什么。**（2026-08-30 用户实测撞到：
      // 「点抖点不开，到不了可以发送对话的界面」—— 当时的实现只让已启动的能点，
      // 而他画布上 13 个 AI 对话一个都没启动过，于是全都点不动、还一个字都没解释。
      // 「点了没反应比不能点更让人困惑」这条我自己写过，却做出了同样的东西。）
      //
      // 现在**没启动的也能点进去** —— 进去发第一条就把它拉起来
      //（用户 2026-08-30 要求「手机可以启动对话」：建出来一个聊不了的框没有意义）。
      // **终端也能点进去看**（用户 2026-08-30 要求「终端的信息也可以被手机读到」），
      // 但只读不发 —— 协议上没有给终端发消息这条路，
      // 而给它做一个发不出去的输入框比不给更糟
      if (s.kind !== 'agent') {
        c.appendChild(el('div', 'why', s.sessionId ? '只能看，不能发' : '还没启动'))
      } else if (!s.sessionId) {
        c.appendChild(el('div', 'why', '还没启动 —— 进去说第一句就开始'))
      }
      // 终端要有 sessionId（其实是 ptyId）才有输出可读；AI 对话没启动也能进去（进去就启动）
      if (s.kind === 'agent' || s.sessionId) {
        c.className = 'card'
        c.onclick = (function (x) {
          return function () {
            sess = x.sessionId || null; sessNode = x.sessionId ? null : x.id
            sessName = x.title; sessRunning = !!x.running; sessKind = x.kind
            view = 'chat'; render()
          }
        })(s)
      }
      b.appendChild(c)
    })
    // 已经有会话时也留一个入口 —— 一个项目开两三个对话是常态
    b.appendChild(newSessionBtn())
  }).catch(function (e) { b.innerHTML = ''; fail(b, e.message) })
}

/** 对话：读最近的往来 + 发一条新的。**手机端第二步。**
 *
 *  ── 为什么内容从主进程来，不从渲染层 ────────────────────────────
 *  对话内容在电脑上只活在那个 AgentChatView 组件的归约器里，
 *  而画布会把视口外的面板整个裁掉 —— 走渲染层的话，「手机上能不能看到回复」
 *  会取决于「电脑画布此刻滚到哪儿」。而这功能正是为够不着电脑时用的。
 *  所以主进程自己留了一份摘要（transcript.ts），这里读它。
 *
 *  ── 只给「说了什么」，不给工具调用 ──────────────────────────────
 *  手机屏就这么大，把执行项也铺上来，正文就被挤没了。
 *  要看它跑了哪些命令，回电脑上看。 */
function renderChat (quiet) {
  var b = shell(sessName || '对话', proj ? projName : '', 'sessions')
  // **还没启动的会话没有 transcript 可读** —— 直接摆输入框，
  // 第一条消息会把它拉起来。不要去请求一个必然为空的接口，
  // 那只会让人看见「正在读…」闪一下再变空
  if (!sess) {
    b.innerHTML = ''
    $('h2').textContent = '还没启动'
    var e0 = el('div', 'empty')
    e0.appendChild(el('b', null, '说第一句就开始'))
    e0.appendChild(document.createTextNode('会在这个项目的目录下起一个 AI 对话，用电脑上第一个可用的 CLI'))
    b.appendChild(e0)
    b.appendChild(composer())
    return
  }
  if (!quiet) loading(b)
  call('transcript', { sessionId: sess, kind: sessKind }).then(function (r) {
    b.innerHTML = ''
    var d = r.data || []
    chatBusy = typeof r.busy === 'boolean' ? r.busy : null
    // **「正在想」要看得见** —— 不然等回复那段时间界面是静止的，
    // 你分不清是它在跑还是已经断了
    $('h2').textContent = chatBusy ? '正在想…' : (d.length ? d.length + ' 条往来' : '还没说过话')
    if (!d.length) {
      var e = el('div', 'empty')
      e.appendChild(el('b', null, sessKind === 'terminal' ? '这个终端还没有输出' : '这个会话还没有对话记录'))
      // **说清楚为什么可能是空的** —— 不说的话用户会以为坏了
      e.appendChild(document.createTextNode(sessKind === 'terminal'
        ? '它跑起来之后，最近的输出会显示在这里'
        : '电脑上开始聊之后，这里就能看到；从这儿发一条也可以'))
      b.appendChild(e)
    } else {
      if (sessKind === 'terminal') {
        // 终端输出是**等宽的整块**，不是一问一答 —— 做成气泡会把每一行
        // 都框起来，反而看不出哪些是同一段
        var pre = el('pre', 'term')
        pre.textContent = d.map(function (m) { return m.text }).join('\n')
        b.appendChild(pre)
      } else {
        var wrap = el('div', 'chat')
        d.forEach(function (m) {
          var bub = el('div', 'bub ' + (m.role === 'user' ? 'me' : 'ai'))
          bub.textContent = m.text
          wrap.appendChild(bub)
        })
        b.appendChild(wrap)
      }
    }
    // **终端不给输入框** —— 协议上没有给终端发消息这条路，
    // 给一个发不出去的框比不给更糟
    if (sessKind === 'agent') b.appendChild(composer())
    // 读完滚到底 —— 手机上要看的是最新那条，不是最早那条
    var sc = document.scrollingElement || document.documentElement
    sc.scrollTop = sc.scrollHeight
  }).catch(function (e) { b.innerHTML = ''; fail(b, e && e.message) })
}

/** 等回复期间的轮询。**停的条件是「它不忙了」**，不是「拉够几次了」。
 *
 *  renderChat 每次都会把 busy 写进 chatBusy —— 这里读它。
 *  两道闸都要：不忙了停（正常出口），5 分钟兜底停（进程卡住时不至于
 *  在手机后台一直打电脑）。 */
var pollTimer = null
function startPoll () {
  stopChatPoll()
  var t0 = Date.now()
  pollTimer = setInterval(function () {
    if (view !== 'chat' || Date.now() - t0 > 300000) { stopChatPoll(); return }
    renderChat(true)
    // chatBusy 由上一次 renderChat 写入；false 说明这一轮跑完了
    if (chatBusy === false) stopChatPoll()
  }, 2500)
}
function stopChatPoll () { if (pollTimer) { clearInterval(pollTimer); pollTimer = null } }

/** 底部输入条。**发送后不清空到「什么都没发生」** —— 手机上没有回执的话，
 *  你不知道到底送出去没有。 */
function composer () {
  var box = el('div', 'composer')
  var ta = document.createElement('textarea')
  ta.placeholder = '说点什么…'
  ta.rows = 1
  // 跟着内容长高，但有上限 —— 不然长文本会把整屏占满
  ta.oninput = function () { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px' }
  var btn = el('button', 'send')
  btn.appendChild(svg('M3 20l18-8L3 4v6l12 2-12 2z'))
  var busy = false
  btn.onclick = function () {
    var t = ta.value.trim()
    if (!t || busy) return
    busy = true; btn.className = 'send busy'
    // **发送中要看得见。** 手机上没有回执的话，你不知道到底送出去没有
    var tip = el('div', 'sending', sess ? '发送中…' : '正在启动对话…（要几秒）')
    box.parentNode && box.parentNode.insertBefore(tip, box)
    // **两条路**：已启动的按 sessionId 发；没启动的带 nodeId，
    // 由电脑那侧把它跑起来并把第一条带进去（边界写在 provider.ts 的 startSession）
    var payload = sess
      ? { sessionId: sess, text: t }
      : { nodeId: sessNode, projectId: proj, text: t }
    call('send', payload).then(function (r) {
      ta.value = ''; ta.style.height = 'auto'
      busy = false; btn.className = 'send'
      if (tip.parentNode) tip.parentNode.removeChild(tip)
      // 刚启动的话把 sessionId 记下来，之后就走正常那条了
      if (!sess && r && r.sessionId) { sess = r.sessionId; sessNode = null }
      // 立刻重拉一次：刚发的那条会出现在列表里（主进程记的是同一份）
      renderChat(true)
      // **跟着 busy 走，不数次数。**（2026-08-30 用户实测撞到：
      // 第一版固定 6 次 × 3 秒 ≈ 18 秒，那次回复超过了这个窗口，
      // 他看到「没有返回信息」—— 而主进程其实早就记下了完整回复。）
      // 固定次数猜不准：一句「你好」几秒，一次改代码几分钟。
      // 判据是「它还在干活吗」，不是「我等够久了吗」。
      // 仍然有上限（5 分钟）—— 进程万一卡住，无限轮询会在手机后台一直打电脑。
      startPoll()
    }).catch(function (e) {
      busy = false; btn.className = 'send'
      if (tip.parentNode) tip.parentNode.removeChild(tip)
      // **失败要说出来**。手机上没有回执的话，你会以为发出去了
      var w = el('div', 'warnbar', '没发出去：' + ((e && e.message) || '未知原因'))
      box.parentNode.insertBefore(w, box)
    })
  }
  box.appendChild(ta); box.appendChild(btn)
  return box
}

function renderFiles () {
  var b = shell(projName, '', 'projects'); loading(b)
  call('files', { projectId: proj }).then(function (r) {
    b.innerHTML = ''
    var d = r.data || []
    $('h2').textContent = 'Frame 里的 ' + d.length + ' 个'
    if (!d.length) {
      var e = el('div', 'empty')
      e.appendChild(el('b', null, '这个项目的 Frame 里没有文件'))
      e.appendChild(document.createTextNode('把文档或图片拖进 Frame 才会出现在这里'))
      b.appendChild(e); return
    }
    var last = null
    d.forEach(function (f) {
      if (f.group !== last) { b.appendChild(el('div', 'grp', f.group)); last = f.group }
      var c = el('div', 'card')
      var row = el('div', 'row')
      row.appendChild(el('span', 'nm', f.name))
      row.appendChild(el('span', 'chip g', f.kind === 'image' ? '图片' : '文档'))
      c.appendChild(row)
      c.onclick = function () { openFile(f) }
      b.appendChild(c)
    })
  }).catch(function (e) { b.innerHTML = ''; fail(b, e.message) })
}

/** 「新建 AI 对话」。**一次调用就完事，不用等电脑上确认** ——
 *  那道闸假设你能碰到电脑，而这功能就是为够不着电脑时用的（2026-08-29 拆掉）。
 *
 *  它只是在画布上加一个空对话框，**不会启动任何进程**；
 *  真正的兜底是：这台设备配过对、每次都留痕、只能建在已有的 Frame 里。 */
function newSessionBtn () {
  var btn = el('button', 'big', '在这个项目新建一个 AI 对话')
  var msg = el('div', 'err', '')
  var wrap = el('div'); wrap.appendChild(btn); wrap.appendChild(msg)
  btn.addEventListener('click', function () {
    btn.disabled = true; btn.textContent = '正在建…'; msg.textContent = ''
    call('newSession', { projectId: proj }).then(function () {
      // 建好了直接刷新会话列表 —— 新的那个会以「还没启动」出现在里面
      view = 'sessions'; render()
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '在这个项目新建一个 AI 对话'
      msg.textContent = e.message === 'renderer-not-ready' ? '电脑正忙，稍后再试' : e.message
    })
  })
  return wrap
}

function openFile (f) {
  var b = shell(f.name, projName, 'files')
  $('nav').hidden = true
  loading(b)
  call('file', { projectId: proj, nodeId: f.id }).then(function (r) {
    b.innerHTML = ''
    if (r.truncated) b.appendChild(el('div', 'warnbar', '文件太大，只显示了前 512KB'))
    if (r.kind === 'image') {
      var img = el('img', 'doc'); img.src = r.dataUrl; b.appendChild(img)
    } else {
      b.appendChild(el('pre', null, r.text || ''))
    }
  }).catch(function (e) {
    b.innerHTML = ''
    var d = el('div', 'empty')
    d.appendChild(el('b', null, e.message === 'not-in-frame' ? '这个内容不在画布上了' : '打不开'))
    d.appendChild(document.createTextNode(
      e.message === 'out-of-bounds' ? '它在项目目录之外，出于安全不能读' : ''))
    b.appendChild(d)
  })
}

function render () {
  stopPoll()
  if (view !== 'chat') stopChatPoll()
  if (!token) { renderPair(); return }
  // **`sess` 或 `sessNode` 有一个就行**（2026-08-30 用户实测撞到：
  // 「新建了 AI 对话点击后会自动跳转到动态页面」）——
  // 还没启动的对话 sess 是 null、只有 sessNode，
  // 原来只判 sess 就掉到最后那条 else 去了，view 被改成 'live'。
  // 那条 else 是「状态凑不齐时的兜底」，而这里状态其实是齐的，
  // 只是齐在另一个字段上。
  if (view === 'chat' && (sess || sessNode)) renderChat()
  else if (view === 'sessions' && proj) renderSessions()
  else if (view === 'files' && proj) renderFiles()
  else if (view === 'projects') renderProjects()
  else { view = 'live'; renderLive() }
}

// ── 前台自动刷新 ──────────────────────────────────────────────
// **只在动态页、只在页面可见时轮询。** 手机上「跑完了没」是要盯着看的，
// 但也不能在你切走之后还在后台打电脑 —— visibilitychange 一走就停。
//
// 真正的推送通知（切出去也能响）需要 service worker + 推送服务端，
// 那是隧道那一步之后的事。**现在不假装有** —— 这里只是前台刷新。
var pollTimer = null
function stopPoll () { if (pollTimer) { clearInterval(pollTimer); pollTimer = null } }
function startPoll (fn) {
  stopPoll()
  pollTimer = setInterval(function () {
    if (document.visibilityState === 'visible' && view === 'live') fn()
  }, 5000)
}
document.addEventListener('visibilitychange', function () {
  // 切回来立刻刷一次，不用等下一个 5 秒
  if (document.visibilityState === 'visible' && view === 'live' && token) renderLive(true)
})

// 连接状态那枚胶囊。第一步只有局域网，**如实写「明文」** ——
// 不能让人以为已经加密了（TLS 是第三步隧道的事）
// **版本号显示出来**（2026-08-30）：手机浏览器会缓存这个页面，
// 升级软件之后手机上跑的可能还是旧版 JS —— 症状是「新功能全都没有」
// 而页面看起来一切正常。排查时来回猜了好几轮，加一个标记就一眼看得出。
// __EAS_VER__ 由服务端在发送时替换成真实版本号
var PAGE_VER = '__EAS_VER__'
// 这一份页面的内容哈希，由服务端在发送时打进来；跟 /health 报的比对
var PAGE_BUILD = '__EAS_BUILD__'
$('connt').textContent = '局域网直连 · 明文 · v' + PAGE_VER + ' · ' + PAGE_BUILD

/** **页面自己发现版本变了就重载。**
 *
 *  手机浏览器会缓存这个页面（尤其 iOS Safari），电脑上升级软件之后，
 *  手机上跑的还是上一版的 JS —— 症状是「新功能全都没有」而页面一切正常。
 *  2026-08-30 用户实测时为此来回了好几轮（他说「一点没变」，
 *  而服务端发的确实是新页面）。
 *
 *  服务端已经加了 no-store，但那只管**下一次加载**；页面开着不动的话，
 *  内存里跑的还是旧 JS。所以这里主动比一次：
 *  /health 是不需要 token 的最轻接口，顺带带上版本号。
 *
 *  **只在版本真的不一样时才 reload** —— 无条件重载会把用户正在打的字冲掉。 */
function watchVersion () {
  setInterval(function () {
    if (document.visibilityState !== 'visible') return
    fetch('/health').then(function (r) { return r.json() }).then(function (j) {
      // **比内容哈希，不比版本号**：开发中改了页面但版本号没变是常态，
      // 只比版本号的话「新功能全都没有」这个症状还会重演
      if (j && j.build && PAGE_BUILD && j.build !== PAGE_BUILD) location.reload()
    }).catch(function () {})
  }, 20000)
}
watchVersion()
render()
})()
</script>
</body></html>
