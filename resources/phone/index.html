<!-- 纯内联、零外部依赖，所以能收得很紧：只允许连自己（/api），图片只有 data: URL。
     `unsafe-inline` 是内联样式和脚本必需的；页面里所有内容都走 textContent 塞，
     从不把服务端返回的字符串当 HTML 解析 —— 这是这条豁免能成立的前提。
     **唯一的例外是本地 HTML 报告**（2026-10-02）：它只进 sandbox="allow-scripts"、**不给 allow-same-origin**
     的 srcdoc iframe —— 报告是不透明来源，读不到本页 localStorage 里的配对 token、碰不到父页面、
     不能跳转顶层或弹窗；它继承本页这条 CSP，所以也连不出去、只能用 data: 图片。见 openFile。 -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Eas-Term</title>
<style>
/* 直接用桌面端 base.css 的那套 token，不另起一套 —— 手机端要跟 app 是同一个东西 */
:root{
  --accent:#a2b9e0; --accent-rgb:162,185,224;
  --fg:#e2e4ea; --fg-dim:#969aa8; --fg-mute:#6d7280;
  --glass-1:rgba(15,17,23,.5); --glass-2:rgba(11,13,19,.62); --glass-3:rgba(25,28,38,.82);
  --gb:rgba(255,255,255,.09); --gbs:rgba(255,255,255,.14);
  --hl:inset 0 1px 0 rgba(255,255,255,.07);
  --r-xl:18px; --r-lg:14px; --r-md:10px; --r-sm:7px;
  --ok:#7ee0b8; --warn:#f5a623; --idle:#3a3f4c; --danger:#f78b96;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(165deg,rgba(7,8,13,.72),rgba(3,4,6,.85)),#06070b;
  color:var(--fg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none}
#hd{flex:none;padding:calc(var(--safe-t) + 14px) 16px 10px}
#h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
#h2{font-size:12px;color:var(--fg-dim);margin-top:3px}
#back{display:none;font-size:13px;color:var(--accent);margin-bottom:8px;cursor:pointer}
#back.on{display:block}
#conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-dim);
  padding:5px 11px;border-radius:var(--r-xl);background:var(--glass-2);border:1px solid var(--gb);
  margin:8px 16px 0}
#body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
#nav{flex:none;display:flex;border-top:1px solid var(--gb);background:var(--glass-1);
  backdrop-filter:blur(14px);padding-bottom:var(--safe-b)}
#nav button{flex:1;background:none;border:0;color:var(--fg-dim);font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;padding:9px 0 8px;cursor:pointer;min-height:52px}
#nav button.on{color:var(--accent)}
#nav svg{display:block}
.card{background:var(--glass-2);border:1px solid var(--gb);box-shadow:var(--hl);
  border-radius:var(--r-lg);padding:12px 13px;margin-bottom:9px;cursor:pointer;
  transition:background .15s;min-height:44px}
.card:active{background:var(--glass-3)}
.card.flat{cursor:default}
.row{display:flex;align-items:center;gap:9px}
.nm{font-size:14px;font-weight:550;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11.5px;color:var(--fg-dim);margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(126,224,184,.14)}
.dot.wait{background:var(--warn);box-shadow:0 0 0 3px rgba(245,166,35,.14)}
.dot.off{background:var(--idle)}
.chip{font-size:10px;padding:2px 7px;border-radius:var(--r-sm);flex:none;font-weight:600;
  background:rgba(var(--accent-rgb),.16);color:var(--accent)}
.chip.g{background:rgba(255,255,255,.05);color:var(--fg-dim);font-weight:500}
.grp{font-size:11px;color:var(--fg-mute);padding:8px 3px 6px;letter-spacing:.03em}
.empty{text-align:center;color:var(--fg-dim);font-size:13px;padding:56px 24px;line-height:1.8}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px;font-weight:600}
pre{margin:0;padding:14px;background:var(--glass-2);border:1px solid var(--gb);
  border-radius:var(--r-lg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.report{display:block;width:100%;height:calc(100vh - 170px);height:calc(100dvh - 170px);border:1px solid var(--gb);
  border-radius:var(--r-lg);background:#fff}
img.doc{width:100%;border-radius:var(--r-lg);border:1px solid var(--gb);display:block}
.warnbar{font-size:11.5px;color:var(--warn);background:rgba(245,166,35,.1);
  border:1px solid rgba(245,166,35,.22);border-radius:var(--r-md);padding:8px 11px;margin-bottom:10px}
input,button.big{width:100%;font-family:inherit;font-size:15px;padding:13px 14px;
  border-radius:var(--r-lg);border:1px solid var(--gb);background:var(--glass-3);color:var(--fg)}
button.big{background:var(--accent);color:#0b0d13;font-weight:650;border:0;margin-top:10px;cursor:pointer}
button.big:disabled{opacity:.45}
.pair{padding:26px 6px}
.pair h3{font-size:19px;margin:0 0 6px;font-weight:650}
.pair p{font-size:13px;color:var(--fg-dim);margin:0 0 18px;line-height:1.7}
.err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:18px}

/* ── 对话（第二步）──────────────────────────────────────────
   气泡沿用规格里那几张样机：自己发的靠右、贴主色；agent 的靠左、玻璃底。
   **底部要给输入条让位** —— 不然最后一条永远压在输入框下面看不全。 */
.why{font-size:11px;color:var(--fg-mute);margin-top:5px;line-height:1.5}
.sending{position:fixed;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:11.5px;color:var(--accent);pointer-events:none}
/* 「回到最新」：往上翻看历史时浮在输入框右上方，点一下滚到最后一条。
   翻着的时候来了新消息，右上角亮一个点 —— 不然你不知道下面多了东西。
   44px 触控下限；位置避开输入条（composer 顶边约在 113px） */
.tolatest{position:fixed;right:14px;bottom:calc(124px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:50%;border:1px solid var(--gb);background:rgba(22,24,31,.92);
  backdrop-filter:blur(12px);color:var(--fg);display:none;align-items:center;justify-content:center;
  padding:0;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:5}
.tolatest.on{display:flex}
.tolatest.new::after{content:'';position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);border:2px solid rgba(22,24,31,.92)}
.term{margin:0;padding:11px 12px 74px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;color:var(--fg-dim)}
.chat{display:flex;flex-direction:column;gap:9px;padding-bottom:74px}
.bub{max-width:82%;padding:9px 12px;border-radius:var(--r-lg);font-size:14px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:rgba(var(--accent-rgb),.16);
  border:1px solid rgba(var(--accent-rgb),.3);border-bottom-right-radius:6px}
/* 正在说的那半句：末尾一个闪烁的光标。**必须跟说完的话看得出区别** ——
   长得一模一样的话，你分不清是「它说完了」还是「还在说」。
   只动 opacity，不动会触发重绘的属性 */
.bub.live::after{content:'▌';margin-left:2px;opacity:.55;animation:cur 1s steps(2) infinite}
@keyframes cur{50%{opacity:0}}
/* 还没开始吐字时的「处理中」气泡：三个依次起落的点 + 此刻在做什么（如「运行 npm test」）。
   没有它的话，AI 跑命令那几十秒对话区完全静止，分不清在跑还是断了（2026-10-02 真机回归）。
   同样只动 opacity / transform */
.bub.status{display:flex;align-items:center;gap:9px;color:var(--fg-dim);font-size:13px}
.bub.status .dots{display:inline-flex;gap:4px;flex:none}
.bub.status .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;
  animation:dot 1.2s ease-in-out infinite}
/* 最多两行：英文那句「Waiting for you to allow on your computer: Run …」一行放不下，关键的命令会被截掉 */
.bub.status .act{min-width:0;overflow:hidden;white-space:normal;word-break:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.bub.live::after,.bub.status .dots i{animation:none}}
.bub.ai{align-self:flex-start;background:var(--glass-2);border:1px solid var(--gb);
  border-bottom-left-radius:6px}
/* Markdown（文档与 AI 回复）。**只构造 DOM、不拼 HTML**，见脚本里 md:begin 那段 */
.md{white-space:normal;word-break:break-word}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;line-height:1.35;font-weight:650}
.md h1{font-size:19px}.md h2{font-size:17px}.md h3{font-size:15.5px}.md h4,.md h5,.md h6{font-size:14.5px}
.md p{margin:0 0 9px}
.md ul,.md ol{margin:0 0 9px;padding-left:20px}
.md li{margin:2px 0}.md li>ul,.md li>ol{margin:3px 0}
.md li.task{list-style:none;margin-left:-18px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;padding:1px 5px;
  border-radius:5px;background:rgba(255,255,255,.07);border:1px solid var(--gb)}
.md pre{margin:0 0 10px;padding:11px 12px;font-size:12px;overflow-x:auto;white-space:pre}
.md pre code{padding:0;border:0;background:none;font-size:inherit}
.md blockquote{margin:0 0 9px;padding:2px 0 2px 11px;border-left:3px solid rgba(var(--accent-rgb),.45);color:var(--fg-dim)}
.md hr{border:0;border-top:1px solid var(--gbs);margin:12px 0}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.md .tw{overflow-x:auto;margin:0 0 10px}
.md table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.md th,.md td{border:1px solid var(--gb);padding:5px 8px;text-align:left;vertical-align:top}
.md th{background:rgba(255,255,255,.05);font-weight:600}
.md del{opacity:.7}
.doc.md{padding:14px;background:var(--glass-2);border:1px solid var(--gb);border-radius:var(--r-lg);font-size:14.5px;line-height:1.7}
/* 吸底输入条。fixed 而不是 sticky —— 手机上滚动容器的 sticky 在某些浏览器里会跳。
   env(safe-area-inset-bottom) 是给全面屏底部那条 home 指示器让位的 */
.composer{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;align-items:flex-end;padding:9px 14px;
  background:rgba(12,13,17,.94);backdrop-filter:blur(12px);border-top:1px solid var(--gb)}
.composer textarea{flex:1;font-family:inherit;font-size:15px;line-height:1.5;padding:10px 12px;
  border-radius:18px;border:1px solid var(--gb);background:var(--glass-3);color:var(--fg);
  resize:none;max-height:120px;overflow-y:auto}
.composer textarea:focus{outline:none;border-color:rgba(var(--accent-rgb),.55)}
/* 44px 是触控目标下限（规格里写死的） */
.send{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:0;
  background:rgba(var(--accent-rgb),.9);color:#0c0d11;display:flex;align-items:center;
  justify-content:center;cursor:pointer}
.send.busy{opacity:.5}
.send svg{width:19px;height:19px}
</style></head><body>

<div id="hd"><div id="back"></div><h1 id="h1"></h1><div id="h2"></div></div>
<div id="conn" hidden><span class="dot on"></span><span id="connt"></span></div>
<div id="body"></div>
<nav id="nav" hidden></nav>

<script>
// **整段包在 IIFE 里，一个全局都不留。**
// 不只是洁癖：真机验证时撞到了 —— 这个页面被 Electron 主窗口打开时，
// 那个窗口的 preload 已经把 `window.api` 挂上了，顶层 `function api()`
// 当场 SyntaxError，整个脚本一行都没执行（页面只剩静态骨架）。
// 手机浏览器里不会有 preload，但「不往全局撒东西」本来就该是默认。
;(function () {
'use strict'
// 手机端。**不引任何框架** —— 四个视图、五个接口，原生 DOM 写得完；
// 引 React 反而要处理构建产物怎么随包发出去。
// **不缓存任何内容**（规格红线）：每次进视图都重新拉，断线就是空白。

var I18N = /*__EAS_I18N__*/null
function tr (k, p) {
  var s = (I18N && I18N.dict && I18N.dict[k]) || k
  return p ? s.replace(/\{(\w+)\}/g, function (m, n) { return p[n] != null ? String(p[n]) : m }) : s
}
if (I18N && I18N.lang === 'en') document.documentElement.lang = 'en'

var TK = 'eas.phone.token'
var token = null
try { token = localStorage.getItem(TK) } catch (e) { /* 隐私模式下会抛 */ }
var view = 'live', proj = null, projName = ''
// 当前打开的对话（第二步）。sess 非空时 view==='chat'
var sess = null, sessName = '', sessRunning = false, sessNode = null, sessKind = 'agent'
// 这段对话在电脑上落盘的存档名（会话列表给的 historyKey）。有它，没启动的旧对话也能读到以前聊过的
var sessHist = null
// 这个会话此刻在不在跑（由 transcript 接口带回来）。轮询靠它决定停不停
var chatBusy = null

var $ = function (id) { return document.getElementById(id) }
var el = function (t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e }

/* md:begin —— 手机上的 Markdown 渲染（文档与 AI 回复，2026-10-02 真机回归补上）。
 *

 * 文档来自项目文件、回复来自 AI，里面混什么都有可能；这个页面的 localStorage 里放着配对 token，
 * 一段注入的脚本就能把它带走。所以原文里的 HTML 一律当文字显示，链接只放行 http(s) 与 mailto，
 * 图片不加载（页面 CSP 只放行 data: 图片），显示成「[图片] 说明文字」。
 * 刻意只做常见子集：标题 / 段落 / 有序无序列表（含嵌套与任务勾选）/ 代码块 / 行内代码 /
 * 粗体 / 斜体 / 删除线 / 引用 / 分隔线 / 表格 / 链接。单个换行保留为换行（AI 回复常这样分行）。 */

function mdInline (text, parent) {
  var re = /(`+)([\s\S]*?[^`])\1(?!`)|\*\*([\s\S]+?)\*\*|__([\s\S]+?)__|~~([\s\S]+?)~~|\*(?!\s)([\s\S]+?)\*|!\[([^\]]*)\]\(([^)\s]*)[^)]*\)|\[([^\]]+)\]\(([^)\s]+)[^)]*\)|(https?:\/\/[^\s<>()　-〿＀-￯]+[^\s<>().,;:!?'"　-〿＀-￯])|\n/g
  var last = 0, m
  while ((m = re.exec(text))) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)))
    if (m[1]) parent.appendChild(el('code', null, m[2]))
    else if (m[3] != null) mdInline(m[3], parent.appendChild(el('strong')))
    else if (m[4] != null) mdInline(m[4], parent.appendChild(el('strong')))
    else if (m[5] != null) mdInline(m[5], parent.appendChild(el('del')))
    else if (m[6] != null) mdInline(m[6], parent.appendChild(el('em')))
    else if (m[8] != null) parent.appendChild(document.createTextNode(tr('phone.img', { alt: m[7] || m[8] })))

var MD_LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/
var MD_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/
function mdCells (line) {

  // 整段 <script> 会在解析阶段就失败 —— 手机页一个功能都用不了，比表格显示不好糟得多

  while (i < lines.length) {

    if (!m || m[1].length < indent) break
    if (m[1].length > indent) { i = mdList(lines, i, list.lastChild || list.appendChild(el('li'))); continue }
    var li = el('li'), body = m[3], task = /^\[([ xX])\]\s+(.*)$/.exec(body)
    if (task) { li.className = 'task'; li.appendChild(document.createTextNode(task[1] === ' ' ? '☐ ' : '☑ ')); body = task[2] }
    mdInline(body, li); list.appendChild(li); i++
    // 列表项的续行（缩进的普通文字）接在这一项里

    if (fence) {
      var code = []; i++
      while (i < lines.length && lines[i].trim().indexOf(fence[1]) !== 0) code.push(lines[i++])

      var pre = el('pre'); var c = el('code', null, code.join('\n')); if (fence[2]) c.setAttribute('data-lang', fence[2])

    if (h) { mdInline(h[2], parent.appendChild(el('h' + h[1].length))); i++; continue }

      out.appendChild(e)
    } else {
      if (sessKind === 'terminal') {
        // 终端输出是**等宽的整块**，不是一问一答 —— 做成气泡会把每一行
        // 都框起来，反而看不出哪些是同一段
        var pre = el('pre', 'term')
        pre.textContent = d.map(function (m) { return m.text }).join('\n')
        out.appendChild(pre)
      } else {
        var wrap = el('div', 'chat')
        d.forEach(function (m) {
          var bub = el('div', 'bub ' + (m.role === 'user' ? 'me' : 'ai'))
          if (m.role === 'user') bub.textContent = m.text
          else mdRender(m.text, bub)
          wrap.appendChild(bub)
        })
        // 正在说的那半句，接在最后。**带一个光标** —— 不然它跟说完的话
        // 长得一模一样，你分不清是「它说完了」还是「还在说」
        if (partial) {
          var live = el('div', 'bub ai live')
          mdRender(partial, live)
          wrap.appendChild(live)
        } else if (working) {
          // 主进程给的 activity 已按电脑界面语言翻好；没有工具在跑时就是「正在想」
          var st = el('div', 'bub ai status')
          var dots = el('span', 'dots')
          // 气泡每次轮询都重建，动画会从头播 —— 按时钟给负延迟，三个点的起落才是连贯的
          var phase = (Date.now() % 1200) / 1000
          for (var k = 0; k < 3; k++) { var dot = el('i'); dot.style.animationDelay = (k * 0.15 - phase) + 's'; dots.appendChild(dot) }
          st.appendChild(dots)
          st.appendChild(el('span', 'act', r.activity || tr('phone.chat.thinking')))
          wrap.appendChild(st)
        }
        out.appendChild(wrap)
      }
    }
    b.insertBefore(out, keep)
    // **终端不给输入框** —— 协议上没有给终端发消息这条路，
    // 给一个发不出去的框比不给更糟
    if (sessKind === 'agent' && !keep) b.appendChild(composer())
    // 读完滚到底 —— 手机上要看的是最新那条，不是最早那条。
    // 但轮询时**你往上翻着看就别把你拽回去**：原来就在底部附近才跟着到底
    // 打开对话（!quiet）一律落在最新那条；排版、字体加载之后高度还会变，下一帧再贴一次底
    if (!quiet || nearEnd) {
      b.scrollTop = b.scrollHeight
      requestAnimationFrame(function () { if (view === 'chat' && sess === mySess) { b.scrollTop = b.scrollHeight; syncToLatest() } })
    } else {
      b.scrollTop = top0
      // 你在上面翻着、下面多了东西 —— 按钮亮个点
      if (chatSig !== null && sig !== chatSig) toLatestBtn.classList.add('new')
    }
    chatSig = sig
    syncToLatest()
  }).catch(function (e) {
    // 轮询偶尔失败一次（Wi-Fi 抖一下）不要把整页换成「连不上」—— 下一拍会再试
    if (quiet || view !== 'chat' || sess !== mySess) return
    b.innerHTML = ''; fail(b, e && e.message)
  })
}

/** 等回复期间的轮询。**停的条件是「它不忙了」**，不是「拉够几次了」。
 *
 *  renderChat 每次都会把 busy 写进 chatBusy —— 这里读它。
 *  两道闸都要：不忙了停（正常出口），5 分钟兜底停（进程卡住时不至于
 *  在手机后台一直打电脑）。
 *
 *  **间隔 900ms**：主进程现在会带回「正在说的那半句」，这个间隔下字是
 *  一小段一小段往外冒的，看起来就是流式。2500ms 太钝 —— 一次冒出一大段，
 *  跟等它说完再显示区别不大。
 *  代价可控：请求只在这个会话**正在跑**的时候发，而且返回的是一个封顶的字符串。 */
// **名字和计时器都不能跟下面「动态」页那套重名**（2026-10-02 真机回归查出）：
// 两个 function startPoll 在同一个作用域里，提升后后一个赢 —— 这里的调用一直落到动态页那个，
// 而它只在 view==='live' 时干活，于是对话页发完消息从来不刷新：看不到「正在想」，回复也要退出重进才出来。
var chatTimer = null
/** 「回到最新」按钮。**挂在 document.body 上、只建一次** —— #body 每次渲染都会被清空 */
var chatSig = null
var toLatestBtn = el('button', 'tolatest')
toLatestBtn.type = 'button'
toLatestBtn.setAttribute('aria-label', tr('phone.chat.toLatest'))
toLatestBtn.title = tr('phone.chat.toLatest')
toLatestBtn.appendChild(svg('M12 5v14M6 13l6 6 6-6'))
toLatestBtn.onclick = function () {
  var b = $('body')
  b.scrollTo ? b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }) : (b.scrollTop = b.scrollHeight)
}
document.body.appendChild(toLatestBtn)
/** 和轮询「跟不跟到底」用同一个判据（离底部 120px）：不再自动跟随的时候，就该给你一个回去的按钮。
 *  贴回底部就收起并清掉新消息的点 */
function syncToLatest () {
  var b = $('body')
  var away = view === 'chat' && b.scrollHeight - b.scrollTop - b.clientHeight >= 120
  toLatestBtn.classList.toggle('on', away)
  if (!away) toLatestBtn.classList.remove('new')
}
$('body').addEventListener('scroll', syncToLatest, { passive: true })
function startChatPoll () {
  stopChatPoll()
  var t0 = Date.now()
  chatTimer = setInterval(function () {
    if (view !== 'chat' || Date.now() - t0 > 300000) { stopChatPoll(); return }
    renderChat(true)
    // chatBusy 由上一次 renderChat 写入；false 说明这一轮跑完了
    if (chatBusy === false) stopChatPoll()
  }, 900)
}
function stopChatPoll () { if (chatTimer) { clearInterval(chatTimer); chatTimer = null } }

/** 底部输入条。**发送后不清空到「什么都没发生」** —— 手机上没有回执的话，
 *  你不知道到底送出去没有。 */
function composer () {
  var box = el('div', 'composer')
  var ta = document.createElement('textarea')
  ta.placeholder = tr('phone.composer.placeholder')
  ta.rows = 1
  // 跟着内容长高，但有上限 —— 不然长文本会把整屏占满
  ta.oninput = function () { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px' }
  var btn = el('button', 'send')
  btn.appendChild(svg('M3 20l18-8L3 4v6l12 2-12 2z'))
  var busy = false
  btn.onclick = function () {
    var t = ta.value.trim()
    if (!t || busy) return
    busy = true; btn.className = 'send busy'
    // **发送中要看得见。** 手机上没有回执的话，你不知道到底送出去没有
    var tip = el('div', 'sending', sess ? tr('phone.composer.sending') : tr('phone.composer.starting'))
    box.parentNode && box.parentNode.insertBefore(tip, box)
    // **两条路**：已启动的按 sessionId 发；没启动的带 nodeId，
    // 由电脑那侧把它跑起来并把第一条带进去（边界写在 provider.ts 的 startSession）
    var payload = sess
      ? { sessionId: sess, text: t }
      : { nodeId: sessNode, projectId: proj, text: t }
    call('send', payload).then(function (r) {
      ta.value = ''; ta.style.height = 'auto'
      busy = false; btn.className = 'send'
      if (tip.parentNode) tip.parentNode.removeChild(tip)
      // 刚启动的话把 sessionId 记下来，之后就走正常那条了
      if (!sess && r && r.sessionId) { sess = r.sessionId; sessNode = null }
      // 立刻重拉一次：刚发的那条会出现在列表里（主进程记的是同一份）
      renderChat(true)
      // **跟着 busy 走，不数次数。**（2026-08-30 用户实测撞到：
      // 第一版固定 6 次 × 3 秒 ≈ 18 秒，那次回复超过了这个窗口，
      // 他看到「没有返回信息」—— 而主进程其实早就记下了完整回复。）
      // 固定次数猜不准：一句「你好」几秒，一次改代码几分钟。
      // 判据是「它还在干活吗」，不是「我等够久了吗」。
      // 仍然有上限（5 分钟）—— 进程万一卡住，无限轮询会在手机后台一直打电脑。
      startChatPoll()
    }).catch(function (e) {
      busy = false; btn.className = 'send'
      if (tip.parentNode) tip.parentNode.removeChild(tip)
      // **失败要说出来**。手机上没有回执的话，你会以为发出去了
      var w = el('div', 'warnbar', tr('phone.composer.failed', { reason: (e && e.message) || tr('phone.composer.unknown') }))
      box.parentNode.insertBefore(w, box)
    })
  }
  box.appendChild(ta); box.appendChild(btn)
  return box
}

function renderFiles () {
  var b = shell(projName, '', 'projects'); loading(b)
  call('files', { projectId: proj }).then(function (r) {
    b.innerHTML = ''
    var d = r.data || []
    $('h2').textContent = tr('phone.files.count', { n: d.length })
    if (!d.length && !partial) {
      var e = el('div', 'empty')
      e.appendChild(el('b', null, tr('phone.files.emptyTitle')))
      e.appendChild(document.createTextNode(tr('phone.files.emptyBody')))
      b.appendChild(e); return
    }
    var last = null
    d.forEach(function (f) {
      if (f.group !== last) { b.appendChild(el('div', 'grp', f.group)); last = f.group }
      var c = el('div', 'card')
      var row = el('div', 'row')
      row.appendChild(el('span', 'nm', f.name))
      row.appendChild(el('span', 'chip g', f.kind === 'image' ? tr('phone.files.kindImage') : f.kind === 'html' ? tr('phone.files.kindHtml') : tr('phone.files.kindDoc')))
      c.appendChild(row)
      c.onclick = function () { openFile(f) }
      b.appendChild(c)
    })
  }).catch(function (e) { b.innerHTML = ''; fail(b, e.message) })
}

/** 「新建 AI 对话」。**一次调用就完事，不用等电脑上确认** ——
 *  那道闸假设你能碰到电脑，而这功能就是为够不着电脑时用的（2026-08-29 拆掉）。
 *
 *  它只是在画布上加一个空对话框，**不会启动任何进程**；
 *  真正的兜底是：这台设备配过对、每次都留痕、只能建在已有的 Frame 里。 */
function newSessionBtn () {
  var btn = el('button', 'big', tr('phone.newChat'))
  var msg = el('div', 'err', '')
  var wrap = el('div'); wrap.appendChild(btn); wrap.appendChild(msg)
  btn.addEventListener('click', function () {
    btn.disabled = true; btn.textContent = tr('phone.newChat.busy'); msg.textContent = ''
    call('newSession', { projectId: proj }).then(function () {
      // 建好了直接刷新会话列表 —— 新的那个会以「还没启动」出现在里面
      view = 'sessions'; render()
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = tr('phone.newChat')
      msg.textContent = e.message === 'renderer-not-ready' ? tr('phone.err.busy') : e.message
    })
  })
  return wrap
}

function openFile (f) {
  var b = shell(f.name, projName, 'files')
  $('nav').hidden = true
  loading(b)
  call('file', { projectId: proj, nodeId: f.id }).then(function (r) {
    b.innerHTML = ''
    if (r.truncated) b.appendChild(el('div', 'warnbar', tr('phone.file.truncated')))
    if (r.kind === 'image') {
      var img = el('img', 'doc'); img.src = r.dataUrl; b.appendChild(img)
    } else if (r.kind === 'html') {
      // **隔离显示**：sandbox 只给 allow-scripts，绝不加 allow-same-origin —— 两个都给等于没有沙箱
      //（同源的 iframe 能自己把 sandbox 属性去掉）。报告的图表脚本照跑，但拿不到配对 token。
      var fr = el('iframe', 'report')
      fr.setAttribute('sandbox', 'allow-scripts')
      fr.setAttribute('referrerpolicy', 'no-referrer')
      fr.setAttribute('title', f.name || 'report')
      fr.srcdoc = r.text || ''
      b.appendChild(fr)
    } else if (/\.(md|markdown|mdx)$/i.test(f.name || '')) {
      b.appendChild(mdRender(r.text || '', el('div', 'doc')))
    } else {
      b.appendChild(el('pre', null, r.text || ''))
    }
  }).catch(function (e) {
    b.innerHTML = ''
    var d = el('div', 'empty')
    d.appendChild(el('b', null, e.message === 'not-in-frame' ? tr('phone.file.gone') : e.message === 'html-too-large' ? tr('phone.file.htmlTooLarge') : tr('phone.file.cantOpen')))
    d.appendChild(document.createTextNode(
      e.message === 'out-of-bounds' ? tr('phone.file.outOfBounds') : ''))
    b.appendChild(d)
  })
}

function render () {
  stopPoll()
  if (view !== 'chat') stopChatPoll()
  toLatestBtn.className = 'tolatest'
  if (!token) { renderPair(); return }
  // **`sess` 或 `sessNode` 有一个就行**（2026-08-30 用户实测撞到：
  // 「新建了 AI 对话点击后会自动跳转到动态页面」）——
  // 还没启动的对话 sess 是 null、只有 sessNode，
  // 原来只判 sess 就掉到最后那条 else 去了，view 被改成 'live'。
  // 那条 else 是「状态凑不齐时的兜底」，而这里状态其实是齐的，
  // 只是齐在另一个字段上。
  if (view === 'chat' && (sess || sessNode)) renderChat()
  else if (view === 'sessions' && proj) renderSessions()
  else if (view === 'files' && proj) renderFiles()
  else if (view === 'projects') renderProjects()
  else { view = 'live'; renderLive() }
}

// ── 前台自动刷新 ──────────────────────────────────────────────
// **只在动态页、只在页面可见时轮询。** 手机上「跑完了没」是要盯着看的，
// 但也不能在你切走之后还在后台打电脑 —— visibilitychange 一走就停。
//
// 真正的推送通知（切出去也能响）需要 service worker + 推送服务端，
// 那是隧道那一步之后的事。**现在不假装有** —— 这里只是前台刷新。
var pollTimer = null
function stopPoll () { if (pollTimer) { clearInterval(pollTimer); pollTimer = null } }
function startPoll (fn) {
  stopPoll()
  pollTimer = setInterval(function () {
    if (document.visibilityState === 'visible' && view === 'live') fn()
  }, 5000)
}
document.addEventListener('visibilitychange', function () {
  // 切回来立刻刷一次，不用等下一个 5 秒
  if (document.visibilityState === 'visible' && view === 'live' && token) renderLive(true)
})

// 连接状态那枚胶囊。第一步只有局域网，**如实写「明文」** ——
// 不能让人以为已经加密了（TLS 是第三步隧道的事）
// **版本号显示出来**（2026-08-30）：手机浏览器会缓存这个页面，
// 升级软件之后手机上跑的可能还是旧版 JS —— 症状是「新功能全都没有」
// 而页面看起来一切正常。排查时来回猜了好几轮，加一个标记就一眼看得出。
// __EAS_VER__ 由服务端在发送时替换成真实版本号
var PAGE_VER = '__EAS_VER__'
// 这一份页面的内容哈希，由服务端在发送时打进来；跟 /health 报的比对
var PAGE_BUILD = '__EAS_BUILD__'
$('connt').textContent = tr('phone.conn.lan', { ver: PAGE_VER, build: PAGE_BUILD })
$('back').textContent = '‹ ' + tr('phone.back')

/** **页面自己发现版本变了就重载。**
 *
 *  手机浏览器会缓存这个页面（尤其 iOS Safari），电脑上升级软件之后，
 *  手机上跑的还是上一版的 JS —— 症状是「新功能全都没有」而页面一切正常。
 *  2026-08-30 用户实测时为此来回了好几轮（他说「一点没变」，
 *  而服务端发的确实是新页面）。
 *
 *  服务端已经加了 no-store，但那只管**下一次加载**；页面开着不动的话，
 *  内存里跑的还是旧 JS。所以这里主动比一次：
 *  /health 是不需要 token 的最轻接口，顺带带上版本号。
 *
 *  **只在版本真的不一样时才 reload** —— 无条件重载会把用户正在打的字冲掉。 */
function watchVersion () {
  setInterval(function () {
    if (document.visibilityState !== 'visible') return
    fetch('/health').then(function (r) { return r.json() }).then(function (j) {
      // **比内容哈希，不比版本号**：开发中改了页面但版本号没变是常态，
      // 只比版本号的话「新功能全都没有」这个症状还会重演
      if (j && j.build && PAGE_BUILD && j.build !== PAGE_BUILD) location.reload()
    }).catch(function () {})
  }, 20000)
}
watchVersion()
render()
})()
</script>
</body></html>
