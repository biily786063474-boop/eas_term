    # Private diagnostic report upload: no change to website/update/download routes.
    location = /diagnostics/v1/reports {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 256k;
        client_body_buffer_size 256k;
        client_body_timeout 10s;
        limit_req zone=eas_diagnostic_rate burst=3 nodelay;
        limit_req_status 429;
        limit_conn eas_diagnostic_conn 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:4187;
        proxy_pass_request_headers off;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header Content-Length $content_length;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
