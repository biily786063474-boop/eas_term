name: Private Windows Diagnostic

# This branch is a private test build. No push/tag trigger, no Release permissions.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build diagnostic installer only
        run: npm run dist:ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnostic unit tests
        run: node --test src/main/diagnostics/core.test.ts src/main/diagnostics/transport.test.ts src/main/diagnostics/pending.test.ts src/main/diagnostics/wiring.test.mjs
      - name: Optional Bizone and real OMP regression
        shell: pwsh
        run: |
          $env:EAS_VERIFY_REAL_OMP = (Resolve-Path "release/win-unpacked/resources/omp/omp.exe").Path
          node --test src/main/capabilityTransport.test.ts src/main/builtinCapabilityHost.test.ts src/main/bizoneRuntime.test.ts src/main/bizoneWindowsDiscovery.test.ts
      - name: Packaged smoke test
        run: node scripts/smoke.mjs "release/win-unpacked/Eas-Term Diagnostic.exe"
      - name: Diagnostic runtime verification
        run: node scripts/verify-diagnostics.mjs "release/win-unpacked/Eas-Term Diagnostic.exe" --upload
      - name: Installer digest
        shell: pwsh
        run: |
          Get-ChildItem release/*setup.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath release/SHA256SUMS.txt -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-verification-win
          path: |
            smoke-out/
            docs/verification/windows-diagnostic/runtime/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: eas-term-windows-diagnostic-private
          path: |
            release/*setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
