name: Windows Git path probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read canonical path behavior in temporary repository
        shell: pwsh
        run: |
          @'
          const fs=require('fs'),os=require('os'),path=require('path'),cp=require('child_process');
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'eas-path-probe-'));
          cp.execFileSync('git',['init'],{cwd:dir,stdio:'ignore'});
          const root=cp.execFileSync('git',['rev-parse','--show-toplevel'],{cwd:dir,encoding:'utf8'}).trim();
          console.log(JSON.stringify({dir,root,realDir:fs.realpathSync(dir),realRoot:fs.realpathSync(root),nativeDir:fs.realpathSync.native(dir),nativeRoot:fs.realpathSync.native(root),equal:fs.realpathSync(dir)===fs.realpathSync(root)},null,2));
          fs.rmSync(dir,{recursive:true,force:true,maxRetries:10});
          '@ | node
