<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密钥柜 · Popup 视觉稿</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#fafafa;color:#242424;--panel:#fff;--text:#242424;--muted:#707070;--line:rgba(11,11,11,.08);--soft:#f3f3f3;--button:#303030;--buttonText:#fff}body.dark{background:#202124;color:#eee;--panel:#292a2d;--text:#eee;--muted:#aaa;--line:rgba(255,255,255,.10);--soft:#333438;--button:#e4e4e7;--buttonText:#252528}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:2px solid #888;outline-offset:4px}.demo{position:relative;z-index:5;display:flex;align-items:center;gap:7px;padding:15px 22px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px}.demo strong{margin-right:auto}.demo button{background:transparent;color:var(--muted);padding:8px 12px;border-radius:7px}.demo button.active{background:var(--soft);color:var(--text)}.workspace{height:calc(100vh - 65px);min-height:680px;position:relative;overflow:hidden;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}.bar{height:46px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:22px;font-size:12px}.bar b{margin-right:auto}.node{position:absolute;border:1px solid var(--line);background:var(--panel);border-radius:14px;box-shadow:0 12px 30px #00000007;overflow:hidden}.node header{padding:16px 20px;border-bottom:1px solid var(--line);font-size:12px}.node article{padding:25px;font-size:13px;line-height:1.9}.node p{color:var(--muted)}.node code{font-size:12px}.node.one{left:6%;top:100px;width:44%;height:405px}.node.two{left:55%;top:160px;width:37%;height:315px}.node.three{left:18%;top:555px;width:56%;height:170px}.skeleton{height:8px;background:var(--soft);border-radius:4px;margin:17px 0}.veil{position:absolute;inset:46px 0 0;z-index:2;background:rgba(38,40,43,.22);backdrop-filter:blur(4px) saturate(.6);display:grid;place-items:center;padding:30px;transition:opacity .18s}.dark .veil{background:rgba(8,9,11,.48)}.veil.off{display:none}.modal{width:420px;max-width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 24px 80px #00000024,0 2px 8px #00000008;position:relative}.close{position:absolute;right:15px;top:15px;width:28px;height:28px;border-radius:7px;background:transparent;color:var(--muted);font-size:20px}.close:hover{background:var(--soft)}.icon{width:42px;height:42px;background:var(--soft);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;margin-bottom:22px}.icon svg{width:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}h1{font-size:23px;font-weight:600;letter-spacing:-.7px;margin:0 0 10px}.lead{font-size:13px;color:var(--muted);line-height:1.75;margin:0}.intro{margin:23px 0;padding:15px 17px;background:var(--soft);border-radius:10px;display:grid;gap:13px}.benefit{font-size:12px;display:flex;gap:11px;line-height:1.6}.benefit i{font-style:normal;color:var(--muted)}.benefit span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.label{font-size:12px;font-weight:500;margin:23px 0 11px}.digits{display:flex;gap:9px}.digit{height:49px;flex:1;border:1px solid var(--line);background:var(--soft);border-radius:8px;display:grid;place-items:center;font-size:22px;color:var(--muted)}.hint{font-size:11px;color:var(--muted);line-height:1.7;margin:11px 0 20px}.primary{width:100%;background:var(--button);color:var(--buttonText);height:42px;border-radius:9px;font-size:13px;font-weight:500}.primary:hover{opacity:.86}.footer{font-size:11px;color:var(--muted);text-align:center;margin:15px 0 0;line-height:1.7}.request{border:1px solid var(--line);border-radius:10px;margin:22px 0;padding:15px;background:var(--soft)}.request small{color:var(--muted);font-size:11px}.request p{font-size:13px;line-height:1.7;margin:9px 0}.request code{font-size:11px;color:var(--muted)}.badge{display:inline-block;margin:0 0 17px;color:#916023;font-size:11px;background:#bb822412;padding:5px 9px;border-radius:5px}.dark .badge{color:#d2b383}.secondary{width:100%;background:transparent;color:var(--muted);font-size:12px;margin-top:14px}.note{position:absolute;left:22px;bottom:18px;font-size:11px;color:var(--muted);z-index:3}.reopen{background:var(--button);color:var(--buttonText);padding:7px 12px;border-radius:6px}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--button);color:var(--buttonText);padding:10px 18px;border-radius:8px;font-size:12px;z-index:9;display:none}@media(max-width:650px){.demo{flex-wrap:wrap;padding:12px}.demo strong{width:100%}.modal{padding:23px}.veil{padding:18px}.node.one{width:80%}.workspace{min-height:710px}.note{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><nav class="demo"><strong>密钥柜 / Popup 视觉稿 02</strong><button class="active" data-mode="setup">首次启用</button><button data-mode="unlock">解锁</button><button data-mode="grant">会话授权</button><button id="theme">暗色预览</button><button id="dim">背景弱化：开</button></nav><main class="workspace"><div class="bar"><b>Eas-Term</b><span>辞典</span><span>密钥柜</span><span>画布</span><span>设置</span></div><section class="node one"><header>◈ &nbsp; AI 对话 · Eas-Term 界面优化</header><article><b>继续完善工作台体验</b><p>已整理当前任务，接下来验证服务调用和界面反馈。</p><div class="skeleton"></div><div class="skeleton" style="width:76%"></div><div class="skeleton" style="width:88%"></div><p>等待密钥柜授权后继续…</p></article></section><section class="node two"><header>›_ &nbsp; 终端 · 项目构建</header><article><code>✓ renderer build completed<br>✓ application ready<br><br>~/Projects/terminal $</code></article></section><section class="node three"><header>▧ &nbsp; 设计选型台</header><article>界面样式 &nbsp; / &nbsp; 设计系统 &nbsp; / &nbsp; 提示词预览</article></section><div class="veil" id="veil"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><button class="close" aria-label="关闭预览" id="close">×</button><div class="icon"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div><div id="content"></div></section></div><div class="note">交互视觉稿 · 不收集密码，不连接真实密钥柜 &nbsp; <button class="reopen" id="reopen">打开弹窗</button></div></main><div class="notice" id="notice"></div><script>
let mode='setup',weak=true;const content=document.getElementById('content'),veil=document.getElementById('veil');const digits='<div class="digits" aria-label="六位数字码示意，不可输入">'+Array.from({length:6},()=>'<span class="digit">·</span>').join('')+'</div>';function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));content.innerHTML=mode==='setup'?`<h1 id="title">让密钥留在密钥柜里</h1><p class="lead">保存一次，按需授权。<br>不必再把 API 密钥粘进聊天。</p><div class="intro"><div class="benefit"><i>⌑</i><div>在这台设备上加密保存<span>由系统安全存储保护你的密钥。</span></div></div><div class="benefit"><i>✓</i><div>由你决定，哪个会话可以使用<span>解锁密钥柜，不等于授权所有密钥。</span></div></div></div><div class="label">创建六位数字码</div>${digits}<p class="hint">用于日常解锁，不是 API 密钥，也不参与密钥加密。</p><button class="primary" id="action">继续</button><p class="footer">下一步确认六位码 · 这段介绍仅首次显示</p>`:mode==='unlock'?`<h1 id="title">解锁密钥柜</h1><p class="lead">输入六位数字码，继续刚才的任务。</p><div class="request"><small>请求来自</small><p>AI 对话 · Eas-Term 界面优化</p><code>仅解锁，不会新增密钥授权</code></div><div class="label">六位数字码</div>${digits}<p class="hint">解锁成功后，自动返回原请求。</p><button class="primary" id="action">解锁并继续</button><button class="secondary" id="later">暂不解锁</button>`:`<span class="badge">AI 发起的使用请求</span><h1 id="title">允许这个会话使用？</h1><p class="lead">密钥已在柜中，无需重新填写。</p><div class="request"><small>AI 原话 · 请自行判断用途</small><p>需要调用图片服务，生成你刚才确认的界面配图。</p><code>示例服务 · IMAGE_API_KEY</code></div><p class="hint">仅授权当前会话。会话关闭后失效。<br>通过包装命令取用；不要让命令打印密钥。</p><button class="primary" id="action">允许当前会话使用</button><button class="secondary" id="later">拒绝此次请求</button>`;document.getElementById('action').onclick=()=>{if(mode==='setup'){content.innerHTML=`<h1 id="title">再确认一次六位码</h1><p class="lead">确保下一次解锁时，你能顺利打开。</p><div class="label">再次输入六位数字码</div>${digits}<p class="hint">此处仅展示样式，不接受或保存真实密码。</p><button class="primary" id="confirm">启用密钥柜</button><button class="secondary" id="back">返回</button>`;document.getElementById('back').onclick=render;document.getElementById('confirm').onclick=()=>toast('仅演示启用 · 未创建真实密钥柜')}else toast('仅演示交互 · 未解锁或授权真实密钥')};if(document.getElementById('later'))document.getElementById('later').onclick=close}function close(){veil.classList.add('off')}function toast(t){let n=document.getElementById('notice');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',2500)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;veil.classList.remove('off');render()});document.getElementById('close').onclick=close;document.getElementById('reopen').onclick=()=>{veil.classList.remove('off');render()};document.getElementById('theme').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'亮色预览':'暗色预览'};document.getElementById('dim').onclick=e=>{weak=!weak;veil.style.background=weak?'':'transparent';veil.style.backdropFilter=weak?'':'none';e.target.textContent='背景弱化：'+(weak?'开':'关')};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></body></html>
