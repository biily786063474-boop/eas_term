<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eas-Term · 对话归档交互稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f0ef;color:#292929;font:14px -apple-system,'PingFang SC',sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #00000010;border-radius:8px;background:var(--panel);color:inherit;padding:8px 12px}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible{outline:2px solid #c8400a;outline-offset:2px}:root{--panel:#fafafa;--hover:#ededeb;--line:#00000010;--muted:#777}body.dark{background:#242424;color:#ddd;--panel:#303030;--hover:#3b3b3b;--line:#ffffff12;--muted:#aaa}.demo{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.demo small{color:var(--muted);margin-left:14px}.stage{height:calc(100dvh - 84px);margin:0 24px;min-height:300px;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;position:relative;box-shadow:0 16px 60px #00000008;display:flex;flex-direction:column}header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}header strong{flex:1;font-size:14px}.dot{width:7px;height:7px;border-radius:50%;background:#799781}.muted{color:var(--muted);font-size:12px}.chat{flex:1;overflow:auto;padding:44px max(24px,calc((100% - 700px)/2))}.bubble{margin:0 0 28px 16%;padding:14px 18px;background:var(--hover);border-radius:14px;line-height:1.8}.answer{line-height:1.9;margin-bottom:26px}.answer h2{font-size:22px;font-weight:550;letter-spacing:-.5px}.composer{margin:0 24px 20px;padding:16px;border:1px solid var(--line);border-radius:14px;color:var(--muted)}.veil{position:absolute;inset:53px 0 0;background:#00000016;backdrop-filter:blur(2px);display:none}.veil.show{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(760px,92%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-16px 0 50px #0000000a}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}.drawer-head h2{font-size:17px;margin:0 0 5px}.filters{padding:0 20px 16px}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px}.tabs button{border:0;border-radius:0;padding:8px 0;background:none;color:var(--muted);white-space:nowrap}.tabs button.active{color:inherit;border-bottom:2px solid #c8400a}input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--hover);color:inherit}.split{display:grid;grid-template-columns:285px 1fr;flex:1;min-height:0;border-top:1px solid var(--line)}.list{overflow:auto;border-right:1px solid var(--line);padding:12px}.group{padding:7px 9px;font-size:11px;color:var(--muted)}.row{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;padding:12px;margin-bottom:5px}.row.selected{background:var(--hover);border-color:var(--line)}.row b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row p{font-size:12px;line-height:1.5;margin:7px 0;color:var(--muted)}.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.preview{display:flex;flex-direction:column;min-height:0}.reading{padding:23px;overflow:auto;flex:1}.reading h3{font-size:19px;font-weight:550;margin:0 0 8px}.label{font-size:11px;color:#8b695a;border:1px solid var(--line);padding:4px 7px;border-radius:5px;display:inline-block;margin:18px 0}.reading p{font-size:13px;line-height:1.85}.who{font-size:11px;color:var(--muted);margin-top:20px}.foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}.primary{background:#3b3b3b;color:#fff;border-color:transparent}.primary:hover{background:#505050}.foot small{width:100%;color:var(--muted);font-size:11px}.toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#3b3b3b;color:white;padding:12px 18px;border-radius:10px;box-shadow:0 8px 30px #0002;display:none;white-space:nowrap}.toast button{background:none;color:white;border:0;padding:0 0 0 15px;text-decoration:underline}.back{display:none}@media(max-width:760px){.demo{padding:0 14px}.demo small{display:none}.stage{margin:0 10px}.drawer{width:100%}.split{grid-template-columns:1fr}.preview{display:none}.drawer.detail .list{display:none}.drawer.detail .filters{display:none}.drawer.detail .preview{display:flex}.drawer.detail .back{display:inline-block}.chat{padding:25px}.drawer-head{padding:13px 16px}header{padding:12px}.muted.status{display:none}}@media(prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(20px);opacity:.5}}}

body.embedded .demo{display:none}body.embedded .stage{margin:0;height:100dvh;min-height:0;border-radius:10px}body.embedded{background:var(--panel)}
.layout-demo{position:fixed;inset:60px 0 0;background:#e9e9e7;z-index:20;display:flex;flex-direction:column;padding:18px 24px;gap:14px}.dark .layout-demo{background:#242424}.layoutbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.layoutbar strong{flex:1}.layoutbar small{color:var(--muted)}.simulation{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;gap:12px;overflow:auto}.simulation iframe{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 10px 35px #00000012}.simulation.compact iframe{width:420px;height:min(420px,100%);max-width:100%}.simulation.split iframe{width:calc(50% - 6px);height:100%;min-width:280px}.layoutnote{font-size:12px;color:var(--muted);line-height:1.6}.embedded header strong{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.embedded header button{white-space:nowrap;padding:7px 9px}.embedded header{gap:6px}.embedded .composer{margin:0 12px 12px;padding:12px}.embedded .drawer-head h2{font-size:15px}.embedded .drawer-head .muted{font-size:11px}.embedded .filters{padding:0 16px 10px}.embedded .reading{padding:14px 18px}.embedded .reading h3{font-size:16px;margin-top:12px}.embedded .foot{padding:10px 14px}.embedded .label{margin:10px 0}.embedded .toast{max-width:95%;white-space:normal;width:max-content}.embedded .back{margin-bottom:6px}
.windowbar{display:none;flex-shrink:0;height:42px;align-items:center;gap:10px;padding:0 12px;background:var(--hover);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.embedded .windowbar{display:flex}.windowbadge{background:var(--panel);border:1px solid var(--line);width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:inherit}.windowactions{margin-left:auto;display:flex;gap:7px}.windowactions button{border:0;background:transparent;padding:3px 5px;font-size:19px;line-height:1;color:var(--muted)}.embedded .veil{top:95px}.embedded header{height:53px;flex-shrink:0}
</style></head><body><div class="demo"><div><b>Eas-Term</b><small>对话归档 · 交互设计稿 / 演示数据，不连接真实会话</small></div><div style="display:flex;gap:6px"><button onclick="layoutDemo('compact')">缩小模块</button><button onclick="layoutDemo('split')">左右分屏</button><button id="theme">切换明暗</button></div></div><main class="stage"><div class="windowbar"><span class="windowbadge">✧</span><span>AI 对话 <span style="margin-left:5px">terminal</span></span><span class="windowactions"><button title="最大化模块" aria-label="最大化模块" onclick="window.parent.postMessage('demo-maximize','*')">⛶</button><button title="关闭模块（演示）" aria-label="关闭模块（演示）" onclick="toast('演示：关闭模块不删除历史对话')">×</button></span></div><header><span class="dot"></span><strong id="title">设计选型台 · 预览体验优化</strong><span class="muted status">已保存到本机</span><button id="history" title="查看历史对话">◷ 历史</button><button id="new" title="保存当前对话并新建">＋ 新对话</button></header><div class="chat" id="chat"><div class="bubble">预览效果和设计规范都放在弹窗里，点击外部关闭。</div><div class="answer"><span class="muted">Claude Code</span><h2>让预览留在当前工作里。</h2><p>两个入口并排呈现，不再新增画布模块。打开预览时弱化背景，关闭后回到原来的选型位置。</p><p>设计规范保持独立入口，不打断当前对话。</p></div></div><div class="composer">跟 AI 说点什么…<div style="margin-top:22px;font-size:11px">Claude Code　·　当前项目　<span style="float:right">↑</span></div></div><div class="veil show" id="veil"><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="历史对话"><div class="drawer-head"><div><h2>历史对话</h2><span class="muted">对话留在本机，关掉模块也能找回</span></div><button id="close" aria-label="关闭历史">×</button></div><div class="filters"><div class="tabs"><button class="active" data-scope="module">本模块</button><button data-scope="project">本项目</button><button data-scope="pinned">已置顶</button></div><input id="search" aria-label="搜索历史对话" placeholder="搜索标题或对话内容…"></div><div class="split"><div class="list" id="list"></div><section class="preview"><div class="reading"><button class="back" id="back">← 返回列表</button><h3 id="ptitle"></h3><div class="muted" id="pmeta"></div><span class="label" id="state"></span><div id="body"></div></div><footer class="foot"><small id="hint">仅查看记录，不启动 AI、不消耗 token</small><button class="primary" id="resume">继续此对话</button><button id="opennew">在新模块打开</button><button id="pin" aria-label="置顶此对话">☆ 置顶</button></footer></section></div></aside></div><div class="toast" id="toast" role="status"></div></main><script>
const $=id=>document.getElementById(id);const items=[{id:1,title:'设计选型台 · 预览体验优化',date:'今天 21:48',cli:'Claude Code',module:true,current:true,pin:false,q:'预览效果和设计规范都放在弹窗里，点击外部关闭。',a:'两个入口并排呈现。关闭弹窗时，保留选中项和滚动位置，不打断选型流程。'},{id:2,title:'密钥柜 · 解锁与授权交互',date:'今天 19:32',cli:'Codex',module:true,pin:true,q:'密钥柜弹出时，下方画布应该视觉弱化。',a:'解锁与授权是两步独立操作。沿用六位数字码，解锁后自动继续原请求，不在对话中显示任何密钥。'},{id:3,title:'终端吸顶 · 暗色模式对比度',date:'昨天 20:06',cli:'Claude Code',module:true,pin:false,legacy:true,q:'吸顶的文字和背景拉不开，看不清。',a:'保留背景层次，提高文字与背景之间的对比。此记录来自旧版缓存，早期消息可能不完整。'},{id:4,title:'甘特图 · 异常任务过滤',date:'昨天 17:24',cli:'Codex',module:false,pin:false,q:'默认隐藏没有正常结束的任务。',a:'过滤只改变展示，不删除任务数据，保留用户手动显示的入口。'}];let scope='module',selected=items[1];function render(){let query=$('search').value.toLowerCase();let result=items.filter(i=>(scope==='project'||scope==='pinned'&&i.pin||scope==='module'&&i.module)&&[i.title,i.q,i.a].join(' ').toLowerCase().includes(query));$('list').innerHTML='<div class="group">'+result.length+' 段对话 · 最近更新</div>';result.forEach(i=>{let b=document.createElement('button');b.className='row'+(i===selected?' selected':'');b.innerHTML='<b>'+(i.pin?'⌑　':'')+i.title+'</b><p>'+i.q+'</p><div class="meta"><span>'+i.cli+'</span><span>'+i.date+'</span></div>';b.onclick=()=>{selected=i;detail();render();$('drawer').classList.add('detail')};$('list').append(b)});if(!result.length)$('list').innerHTML+='<p class="muted" style="padding:12px">没有匹配的对话，试试其他关键词。</p>'}function detail(){$('ptitle').textContent=selected.title;$('pmeta').textContent=selected.cli+' · '+selected.date;$('state').textContent=selected.legacy?'旧版记录 · 可能不完整':selected.current?'当前对话':'已保存';$('body').innerHTML='<div class="who">你</div><p>'+selected.q+'</p><div class="who">'+selected.cli+'</div><p>'+selected.a+'</p>';$('resume').textContent=selected.legacy?'以记录开启新对话':selected.current?'返回当前对话':'继续此对话';$('hint').textContent=selected.legacy?'演示：原 CLI 上下文不可用，需确认引用范围后新建':'仅查看记录，不启动 AI、不消耗 token';$('pin').textContent=selected.pin?'★ 已置顶':'☆ 置顶'}function close(){$('veil').classList.remove('show');$('history').focus()}function open(){$('veil').classList.add('show');$('drawer').classList.remove('detail');render();detail();$('search').focus()}function toast(s,link=false){$('toast').textContent=s;if(link){let b=document.createElement('button');b.textContent='查看';b.onclick=()=>{$('toast').style.display='none';open()};$('toast').append(b)}$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',6000)}$('history').onclick=open;$('close').onclick=close;$('veil').onclick=e=>{if(e.target===$('veil'))close()};document.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('veil').classList.contains('show')){let a=[...$('drawer').querySelectorAll('button,input')].filter(x=>x.getClientRects().length);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}};$('search').oninput=render;document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active',x===b));render()});$('pin').onclick=()=>{selected.pin=!selected.pin;render();detail()};$('back').onclick=()=>$('drawer').classList.remove('detail');$('theme').onclick=()=>document.body.classList.toggle('dark');$('resume').onclick=()=>{if(selected.legacy){toast('演示：需确认引用内容，不冒充原会话恢复');return}close();$('title').textContent=selected.title;$('chat').innerHTML='<div class="bubble">'+selected.q+'</div><div class="answer"><span class="muted">'+selected.cli+'</span><h2>接着上次，继续。</h2><p>'+selected.a+'</p></div>';toast('演示切换完成 · 未启动真实 AI')};$('opennew').onclick=()=>toast('演示：在新模块打开，当前对话保持不变');$('new').onclick=()=>{if(!window.confirm('创建新对话？\n\n当前对话将先保存，随后开启一段全新的对话，不携带旧上下文。旧记录可从「历史」找回。\n\n这是交互演示，不会修改真实记录。'))return;close();$('title').textContent='新对话';$('chat').innerHTML='<div class="answer"><h2>从这里，开始下一件事。</h2><p class="muted">上一段对话已保存，可随时从右上角「历史」找回。</p></div>';toast('演示：上一段已保存',true)};render();detail();$('search').focus();
window.addEventListener('message',e=>{if(e.data==='demo-maximize'&&[...document.querySelectorAll('.simulation iframe')].some(f=>f.contentWindow===e.source)){document.querySelector('.layout-demo')?.remove();close();toast('演示：最大化当前模块')}});const params=new URLSearchParams(location.search);if(params.has('embedded')){document.body.classList.add('embedded');if(params.get('theme')==='dark')document.body.classList.add('dark');close();if(params.get('history')==='1')open();}
window.addEventListener('message',e=>{if(e.source===window.parent&&e.data==='demo-close-history')close()});
document.addEventListener('pointerdown',e=>{const layout=document.querySelector('.layout-demo');if(layout){layout.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage('demo-close-history','*'));}else if(!document.body.classList.contains('embedded')&&$('veil').classList.contains('show')&&!$('drawer').contains(e.target)&&!$('history').contains(e.target)){close();}if(document.body.classList.contains('embedded'))window.parent.postMessage('demo-module-interaction','*');},true);
window.addEventListener('message',e=>{if(e.data==='demo-module-interaction'){const frames=[...document.querySelectorAll('.simulation iframe')];if(frames.some(f=>f.contentWindow===e.source))frames.filter(f=>f.contentWindow!==e.source).forEach(f=>f.contentWindow.postMessage('demo-close-history','*'));}});
function layoutDemo(mode){document.querySelector('.layout-demo')?.remove();const wrap=document.createElement('section');wrap.className='layout-demo';const bar=document.createElement('div');bar.className='layoutbar';bar.innerHTML='<strong>'+(mode==='compact'?'缩小回画布 · 420px 模块':'左右分屏 · 两个独立对话模块')+'</strong><small>演示尺寸随窗口适配 · 非真实会话</small>';const back=document.createElement('button');back.textContent='返回完整稿';back.onclick=()=>wrap.remove();bar.append(back);wrap.append(bar);const sim=document.createElement('div');sim.className='simulation '+mode;for(let n=0;n<(mode==='split'?2:1);n++){const frame=document.createElement('iframe');frame.title=n?'右侧独立对话':'缩小模块交互演示';frame.src=location.pathname+'?embedded=1&history='+(n?'0':'1')+'&theme='+(document.body.classList.contains('dark')?'dark':'light');sim.append(frame)}wrap.append(sim);const note=document.createElement('div');note.className='layoutnote';note.textContent='点击历史条目 → 查看详情 → 返回列表。历史层只遮罩所属模块，另一侧仍可操作；底部操作固定。这里的“缩小”指从最大化还原为画布模块，不是最小化整个应用。';wrap.append(note);document.body.append(wrap)}

</script></body></html>
