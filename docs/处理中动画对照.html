  /* 对话流里的真实上下文：11.5px 的 --fg-dim 文字、容器 opacity .8、球用 --accent */
  .busy { display: inline-flex; align-items: center; gap: 7px; color: var(--fg-dim);

<div class="wrap">
<h1>「正在处理」动画 —— 定档记录</h1>
<p class="sub">形态取自 <code>orbs.jakubantalik.com</code> 的 <code>solving</code>（组件内部叫 rubik）：
一个点阵球，14 层像魔方一样依次拧过去，再逐层拧回来，停顿，循环。</p>
<p class="lede">这页跑的是仓库里 <code>src/renderer/src/features/agentChat/orbGeometry.ts</code> 的同一份代码，
不是另画一遍。一律不带胶囊/边框/底色 —— 参考站那颗 pill 是它作为展示件的需要，
摆进对话流里会让这行提示看起来像个可点的控件。</p>

<script type="module">
// src/renderer/src/features/agentChat/orbGeometry.ts
var SOLVING = {
  latRings: 15,
  lonDensity: 40,
  moveCount: 14,
  rBase: 0.6,
  rDepth: 1.7,
  rActive: 0.3,
  inkFar: 0.62,
  inkSpan: 0.54,
  rsPow: 0.6,
  rMin: 0.3
};
var INLINE_TUNING = { speed: 1.9, count: 0.2, size: 1.35 };
function hash(i, seed) {
  const n = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function makeMoves(count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const axis = Math.min(2, Math.floor(hash(i, 2.3) * 3));
    const lo = -1 + 0.5 * Math.min(3, Math.floor(hash(i, 5.9) * 4));
    out.push({ axis, lo, hi: lo + 0.5, ang: (hash(i, 7.7) < 0.5 ? 1 : -1) * (Math.PI / 2) });
  }
  return out;
}
function moveProgress(t, count, step = 0.42, pause = 1.2) {
  const cycle = 2 * count * step + pause;
  const u = t % cycle;
  const amount = new Array(count).fill(0);
  if (u >= 2 * count * step) return { amount, active: -1 };
  const s = Math.floor(u / step);
  const f = (u - s * step) / step;
  const h = 1 - (1 - Math.min(1, f / 0.7)) ** 3;
  if (s < count) {
    for (let i = 0; i < s; i++) amount[i] = 1;
    amount[s] = h;
    return { amount, active: s };
  }
  const p = 2 * count - 1 - s;
  for (let i = 0; i < p; i++) amount[i] = 1;
  amount[p] = 1 - h;
  return { amount, active: p };
}
function applyMoves(p, moves, prog) {
  let [x, y, z] = p;
  let onActive = false;
  for (let i = 0; i < moves.length; i++) {
    if (prog.amount[i] <= 0) continue;
    const m = moves[i];
    const coord = m.axis === 0 ? x : m.axis === 1 ? y : z;
    if (coord < m.lo || coord >= m.hi) continue;
    if (i === prog.active) onActive = true;
    const a = m.ang * prog.amount[i];
    const c = Math.cos(a);
    const s = Math.sin(a);
    if (m.axis === 0) {
      const ny = y * c - z * s;
      z = y * s + z * c;
      y = ny;
    } else if (m.axis === 1) {
      const nx = x * c + z * s;
      z = -x * s + z * c;
      x = nx;
    } else {
      const nx = x * c - y * s;
      y = x * s + y * c;
      x = nx;
    }
  }
  return [x, y, z, onActive];
}
function project(yaw, pitch, cx, cy, radius) {
  const sp = Math.sin(pitch);
  const cp = Math.cos(pitch);
  const sy = Math.sin(yaw);
  const cyw = Math.cos(yaw);
  return (x, y, z) => {
    const px = x * cyw + z * sy;
    const pz = -x * sy + z * cyw;
    const gy = y * cp - pz * sp;
    const gz = y * sp + pz * cp;
    return [cx + px * radius, cy - gy * radius, gz];
  };
}
function sizeScale(px, pow) {
  return (px / 300) ** pow;
}
function scaleCount(cfg, count) {
  const l = Math.sqrt(count);
  return {
    ...cfg,
    latRings: Math.max(2, Math.round(cfg.latRings * l)),
    lonDensity: Math.max(2, Math.round(cfg.lonDensity * l))
  };
}
function scaleSize(cfg, size) {
  return { ...cfg, rBase: cfg.rBase * size, rDepth: cfg.rDepth * size, rActive: cfg.rActive * size };
}
function buildOrb(px, t, cfg) {
  const c = px / 2;
  const radius = px / 2 * 0.82;
  const proj = project(t * 0.55, 0.35 + 0.1 * Math.sin(t * 0.9), c, c, radius);
  const ss = sizeScale(px, cfg.rsPow);
  const moves = makeMoves(cfg.moveCount);
  const prog = moveProgress(t, cfg.moveCount);
  const dots = [];
  for (let g = 0; g <= cfg.latRings; g++) {
    const lat = -Math.PI / 2 + g / cfg.latRings * Math.PI;
    const cl = Math.cos(lat);
    const sl = Math.sin(lat);
    const n = Math.max(1, Math.round(Math.abs(cl) * cfg.lonDensity));
    for (let d = 0; d < n; d++) {
      const lon = d / n * 2 * Math.PI;
      const [x, y, z, act] = applyMoves(
        [cl * Math.cos(lon), sl, cl * Math.sin(lon)],
        moves,
        prog
      );
      const [sx, sy, sz] = proj(x, y, z);
      const depth = (sz + 1) / 2;
      const ink = cfg.inkFar - cfg.inkSpan * depth - (act ? 0.14 : 0);
      dots.push({
        x: sx,
        y: sy,
        z: sz,
        r: Math.max(cfg.rMin, (cfg.rBase + cfg.rDepth * depth + (act ? cfg.rActive : 0)) * ss),
        // 参考站画在浅底上，`ink` 越小越深越显眼；我们是深色底，翻过来用
        lum: 1 - ink
      });
    }
  }
  dots.sort((a, b) => a.z - b.z);
  return dots;
}
/* export {
  INLINE_TUNING,
  SOLVING,
  applyMoves,
  buildOrb,
  hash,
  makeMoves,
  moveProgress,
  project,
  scaleCount,
  scaleSize,
  sizeScale
};

function orb(px, count, size, speed) {
  const cv = document.createElement('canvas')
  const dpr = Math.min(3, devicePixelRatio || 1)
  cv.width = px * dpr; cv.height = px * dpr
  cv.style.width = px + 'px'; cv.style.height = px + 'px'
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr)
  const cfg = scaleSize(scaleCount(SOLVING, count), size)
  let t = 0, last = performance.now()
  const rgb = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()
  const tick = (now) => {
    requestAnimationFrame(tick)
    if (now - last < 1000 / 30) return
    t += Math.min(now - last, 100) / 1000 * speed; last = now
    ctx.clearRect(0, 0, px, px)
    for (const d of buildOrb(px, t, cfg)) {
      ctx.globalAlpha = d.lum
      ctx.fillStyle = rgb
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill()
    }
    ctx.globalAlpha = 1
  }
  requestAnimationFrame(tick)
  return { cv, n: buildOrb(px, 1, cfg).length, cycle: (2 * cfg.moveCount * 0.42 + 1.2) / speed }
}

function cell(host, title, node, note, pick, tag) {
  const d = document.createElement('div'); d.className = 'cell' + (pick ? ' pick' : '')
  if (tag) d.innerHTML = '<span class="tag">' + tag + '</span>'
  const h = document.createElement('h3'); h.textContent = title; d.appendChild(h)
  const b = document.createElement('div'); b.className = 'busy'
  b.appendChild(node); b.appendChild(document.createTextNode('正在处理…'))
  d.appendChild(b)
  if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; d.appendChild(n) }
  host.appendChild(d)
}

const ref = document.getElementById('ref')
const old = document.createElement('span')
old.className = 'old'; old.style.cssText = 'display:inline-flex;gap:7px;align-items:center'
old.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>'
cell(ref, '改之前：三点呼吸', old, '5px 圆点，错相位 opacity + transform')
{
  const o = orb(20, 0.088, 1.9, 1.95)
  cell(ref, '参考站 20px 档，照搬', o.cv, o.n + ' 个点 —— 太稀，看不出是个球，也看不出哪一层在拧')
}
{
  const o = orb(56, 0.35, 1.05, 1.82)
  cell(ref, '参考站 64px 档，照搬', o.cv, o.n + ' 个点 —— 结构清楚，但摆进 11.5px 的一行里太大')
}

const pick = document.getElementById('pick')
{
  const o = orb(28, 0.2, 1.35, 1.9)
  cell(pick, '28px · count .2 · size 1.35 · speed 1.9', o.cv,
    o.n + ' 个点 · 一轮 ' + o.cycle.toFixed(1) + 's（打乱 14 层 + 复原 + 停顿）', true, '在用')
}
for (const v of [[24, .16, 1.5, 1.9], [32, .24, 1.2, 1.88], [40, .3, 1.1, 1.85]]) {
  const o = orb(v[0], v[1], v[2], v[3])
  cell(pick, v[0] + 'px · count ' + v[1] + ' · size ' + v[2], o.cv, o.n + ' 个点 · 一轮 ' + o.cycle.toFixed(1) + 's')
}
</script>
