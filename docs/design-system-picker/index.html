<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计系统语料库 · 选型台</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#f5f5f5;font-size:14px;line-height:1.6;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(14px);
 border-bottom:1px solid #262626;padding:14px 24px}
.hwrap{max-width:1320px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
.stat{font-size:12px;color:#737373}.stat b{color:#d4d4d4}
input#q{flex:1;min-width:180px;background:#141414;border:1px solid #2e2e2e;border-radius:9px;
 color:#f5f5f5;font-size:13px;padding:8px 12px;outline:none}
input#q:focus{border-color:#525252}
.filters{max-width:1320px;margin:12px auto 0;padding:0 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fsep{width:1px;height:16px;background:#2e2e2e;margin:0 4px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid #2e2e2e;color:#a3a3a3;
 cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{color:#f5f5f5;border-color:#525252}
.chip.on{background:#1f2ff1;border-color:#1f2ff1;color:#fff}
.chip.tone.on{background:#c4b5fd;border-color:#c4b5fd;color:#111}
main{max-width:1320px;margin:20px auto 90px;padding:0 24px}
.count-note{color:#525252;font-size:12px;margin:0 0 14px}
.grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:rgba(23,23,23,.5);border:1px solid #262626;border-radius:14px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#3a3a3a}
.swatch{display:flex;height:54px}.swatch i{flex:1;min-width:0}
.swatch.thin{height:30px;background:repeating-linear-gradient(45deg,#151515,#151515 8px,#1b1b1b 8px,#1b1b1b 16px)}
.cbody{padding:13px 15px}
.ctitle{font-size:13.5px;font-weight:600;margin:0 0 7px;line-height:1.35}
.ctags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:11px;padding:1.5px 8px;border-radius:5px;background:#1f1f1f;color:#a3a3a3}
.tag.tone-dark{background:#1a1a2e;color:#a5b4fc}.tag.tone-light{background:#f5f5f5;color:#333}
.tag.tone-unknown{background:#2a241a;color:#d4b483}
.metrics{font-size:11.5px;color:#737373;display:flex;gap:12px;margin-bottom:11px;align-items:center}
.metrics .dot{width:11px;height:11px;border-radius:3px;border:1px solid #333;display:inline-block;vertical-align:-1px}
.links{display:flex;gap:7px;flex-wrap:wrap}
.btn{font-size:11.5px;padding:5px 11px;border-radius:8px;border:1px solid #2e2e2e;color:#a3a3a3;
 cursor:pointer;transition:.15s;background:none;font-family:inherit}
.btn:hover{color:#f5f5f5;border-color:#525252;background:#1c1c1c}
.btn.primary{border-color:#2d3ac8;color:#a5b4fc}
.btn.primary:hover{background:#141a3a;border-color:#3d4bf5}
.empty{color:#737373;text-align:center;padding:60px 0}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
 background:#1f2ff1;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;
 pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{max-width:1320px;margin:0 auto;padding:28px 24px;color:#525252;font-size:12px;border-top:1px solid #1f1f1f;line-height:1.8}
</style></head><body>
<header><div class="hwrap">
  <h1>设计系统语料库</h1>
  <span class="stat" id="stat"></span>
  <input id="q" placeholder="搜索标题 / slug / 分类…" autocomplete="off">
</div>
<div class="filters" id="filters"></div>
</header>
<main>
  <p class="count-note" id="note"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的</div>
</main>
<footer>挑中一套后：点 <b style="color:#a5b4fc">复制语料</b> 直接拿精简规范贴给 AI；或点 <b>选它</b> 复制指令，让 AI 跑 <code>ds.py --emit &lt;slug&gt;</code> 取完整语料（含全部 token + 使用指引）。色调徽章：<b style="color:#a5b4fc">暗</b> / <b style="color:#999">亮</b> / <b style="color:#d4b483">混合</b>（动效类无明确色调）。</footer>
<div id="toast"></div>

function chip(label,count,kind,val,cur){
  const c=document.createElement('span');
  c.className='chip'+(kind==='tone'?' tone':'')+(val===cur?' on':'');
  c.textContent=count==null?label:`${label} ${count}`;
  c.onclick=()=>{
    if(kind==='svc')activeSvc=activeSvc===val?null:val;
    else if(kind==='tone')activeTone=activeTone===val?null:val;
    else activeSrc=activeSrc===val?null:val;
    render();
  };
  return c;
}
function buildFilters(){
  const f=el('filters');f.innerHTML='';
  f.appendChild(chip('全部',DATA.length,'svc',null,activeSvc));
  ['dark','light','unknown'].forEach(t=>{
    const n=DATA.filter(k=>k.tone===t).length;
    if(n)f.appendChild(chip(t==='dark'?'暗色':t==='light'?'亮色':'混合',n,'tone',t,activeTone));
  });
  const sep=document.createElement('span');sep.className='fsep';f.appendChild(sep);
  svcList.forEach(([s,c])=>f.appendChild(chip(s,c,'svc',s,activeSvc)));
}
function matches(k){
  if(activeSvc&&!(k.services||[]).includes(activeSvc))return false;
  if(activeTone&&k.tone!==activeTone)return false;
  if(activeSrc&&k.source!==activeSrc)return false;
  if(kw){const h=(k.title+' '+k.slug+' '+(k.services||[]).join(' ')+' '+(k.swatch||[]).map(s=>s.n).join(' ')).toLowerCase();if(!h.includes(kw))return false;}
  return true;
}
function card(k){
  const thin=!(k.swatch||[]).length;
  const sw=thin?'<div class="swatch thin"></div>':
    `<div class="swatch">${k.swatch.map(s=>`<i style="background:${s.v}" title="${s.n}: ${s.v}"></i>`).join('')}</div>`;
  const toneCn=k.tone==='dark'?'暗':k.tone==='light'?'亮':'混合';
  const tags=`<span class="tag tone-${k.tone||'unknown'}">${toneCn}</span>`+
    (k.services||[]).map(s=>`<span class="tag">${s}</span>`).join('');
  const brandDot=k.brand?`<span><span class="dot" style="background:${k.brand}"></span> ${k.brand}</span>`:'';
  return `<div class="card">${sw}<div class="cbody">
    <p class="ctitle">${k.title}</p><div class="ctags">${tags}</div>
    <div class="metrics"><span><b style="color:#c4b5fd">${k.tokenCount}</b> tokens</span>${brandDot}</div>
    <div class="links">
      <button class="btn primary" onclick="copyCorpus('${k.slug}')">复制语料</button>
      <button class="btn" onclick="pickIt('${k.slug}')">选它</button>
    </div></div></div>`;
}
function render(){
  buildFilters();
  const list=DATA.filter(matches);
  el('grid').innerHTML=list.map(card).join('');
  el('note').textContent=`显示 ${list.length} / ${DATA.length} 套`;
  el('empty').style.display=list.length?'none':'block';
  el('stat').innerHTML=`<b>${DATA.length}</b> 套设计系统 · 挑中即取语料`;
}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function copyCorpus(slug){
  const k=DATA.find(x=>x.slug===slug);
  navigator.clipboard.writeText(k.corpus||'').then(()=>toast('已复制「'+k.title+'」精简语料'));
}
function pickIt(slug){
  const k=DATA.find(x=>x.slug===slug);
  navigator.clipboard.writeText(`我选了设计系统 ${slug}（${k.title}），用 ds.py --emit ${slug} 给我完整语料后照它借鉴`).then(()=>toast('已复制指令，粘回对话即可'));
}
el('q').addEventListener('input',e=>{kw=e.target.value.trim().toLowerCase();render();});
el('q').value='chatgpt';kw='chatgpt';
render();
</script></body></html>
