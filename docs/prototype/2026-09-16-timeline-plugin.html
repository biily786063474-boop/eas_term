function calendar(){const names=['一','二','三','四','五','六','日'];$('#calendar').replaceChildren();names.forEach(n=>{const x=document.createElement('span');x.className='weekday';x.textContent=n;$('#calendar').append(x)});const offset=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<offset;i++){const x=document.createElement('div');x.className='blank';$('#calendar').append(x)}let total=0,active=0;const days=new Date(year,month+1,0).getDate();for(let d=1;d<=days;d++){const n=count(month,d);total+=n;if(n)active++;const b=document.createElement('button');b.className='cell'+(month===8&&d===16?' today':'');b.style.setProperty('--heat',palettes[n===0?0:n<=2?1:n<=4?2:n<=6?3:4]);b.innerHTML='<span class="num">'+d+'</span><span class="amount">'+(n?n+' 项':'—')+'</span>';b.setAttribute('aria-label',`${month+1}月${d}日，${n}项里程碑`);b.dataset.day=d;b.onclick=()=>{const rect=b.getBoundingClientRect(),base=$('.month').getBoundingClientRect();$('.month').style.setProperty('--ox',((rect.left+rect.width/2-base.left)/base.width*100)+'%');$('.month').style.setProperty('--oy',((rect.top+rect.height/2-base.top)/base.height*100)+'%');day=d;selected=Math.min(2,Math.max(0,n-1));loadDay();changeView('day',$('#dial'))};$('#calendar').append(b)}$('#monthTitle').innerHTML=String(month+1).padStart(2,'0')+' 月 <span>'+year+'</span>';$('#monthSummary').textContent=`${active} 个有成果的日子 · ${total} 项里程碑 · 示例数据`;$('#prevMonth').disabled=month===0;$('#nextMonth').disabled=month===8}
function loadDay(){items=getItems(month,day);$('#dayTag').textContent=`DAY ${String(day).padStart(2,'0')} / ${String(new Date(year,month+1,0).getDate())}`;$('#dateLabel').textContent=dateText();$('#wheel').replaceChildren();if(!items.length){$('#wheel').innerHTML='<div class="empty-day"><h2>这一天，留白。</h2><p>还没有记录里程碑，可以返回月度足迹查看其他日期。</p></div>'}items.forEach((r,i)=>{const b=document.createElement('button');b.className='wheel-item';b.innerHTML='<time></time><span class="mark"></span><span class="title"></span><span class="enter" aria-hidden="true">↗</span>';b.querySelector('time').textContent=r.time;b.querySelector('.title').textContent=r.title;b.setAttribute('aria-label',r.time+' '+r.title+'，选择后再次点击查看详情');b.onclick=()=>{if(selected===i)openDetail();else select(i)};$('#wheel').append(b)});position()}
function position(){document.querySelectorAll('.wheel-item').forEach((b,i)=>{const d=i-selected,a=Math.abs(d);b.style.setProperty('--x',(-(Math.min(a,5)**2)*12)+'px');b.style.setProperty('--y',(d*80)+'px');b.style.setProperty('--tilt',(d*2.5)+'deg');b.style.setProperty('--blur',(a*2)+'px');b.style.setProperty('--opacity',Math.max(0,1-a*.25));b.style.setProperty('--pointer',a>3?'none':'auto');b.setAttribute('aria-current',i===selected);b.tabIndex=a>3?-1:0});$('#position').textContent=items.length?String(selected+1).padStart(2,'0'):'00';$('#total').textContent='/ '+String(items.length).padStart(2,'0')+' 项成果';$('#up').disabled=selected===0||!items.length;$('#down').disabled=selected>=items.length-1;$('.center-rule').hidden=!items.length;$('.ambient-halo').hidden=!items.length;$('#wheelHint').textContent=items.length?'滚动选择 · 点击中心标题展开':'此日暂无记录'}function select(i){selected=Math.max(0,Math.min(items.length-1,i));position()}function detail(){const r=items[selected];if(!r)return;$('#detailDate').textContent=dateText();$('#taskNumber').textContent='MILESTONE / '+String(selected+1).padStart(2,'0');$('#taskTitle').textContent=r.title;$('#taskState').textContent=r.ok?'已验证 · 示例':'待验证 · 示例';$('#taskTime').textContent=r.time;$('#taskAuthor').textContent=r.author+' 写入';$('#taskDescription').textContent=r.body;$('#taskProof').replaceChildren();r.proof.forEach(t=>{const p=document.createElement('p');p.textContent=t;$('#taskProof').append(p)});$('#previousTask').disabled=selected===0;$('#nextTask').disabled=selected===items.length-1}function openDetail(){if(!items.length)return;detail();changeView('detail',$('#toDay'))}
$('#toMonth').onclick=()=>{calendar();changeView('month',document.querySelector(`[data-day="${day}"]`))};$('#toDay').onclick=()=>changeView('day',$('#dial'));$('#up').onclick=()=>select(selected-1);$('#down').onclick=()=>select(selected+1);$('#previousTask').onclick=()=>{select(selected-1);detail()};$('#nextTask').onclick=()=>{select(selected+1);detail()};$('#prevMonth').onclick=()=>{month=Math.max(0,month-1);calendar()};$('#nextMonth').onclick=()=>{month=Math.min(8,month+1);calendar()};$('#dial').onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();select(selected+(e.key==='ArrowDown'?1:-1))}else if(e.key==='Enter'&&e.target===$('#dial')){e.preventDefault();openDetail()}};let lastWheel=0;$('#dial').addEventListener('wheel',e=>{if(view!=='day'||!items.length)return;e.preventDefault();if(Math.abs(e.deltaY)<5||Date.now()-lastWheel<240)return;lastWheel=Date.now();select(selected+Math.sign(e.deltaY))},{passive:false});let startY=0;$('#dial').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});$('#dial').addEventListener('touchend',e=>{const delta=startY-e.changedTouches[0].clientY;if(Math.abs(delta)>35)select(selected+Math.sign(delta))});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(view==='detail')$('#toDay').click();else if(view==='day')$('#toMonth').click()}});$('#motionToggle').onclick=()=>{const reduced=app.classList.toggle('motion-pause');$('#motionToggle').setAttribute('aria-pressed',reduced);$('#motionToggle').textContent=reduced?'恢复动态效果':'减少动态效果'};calendar();loadDay();changeView('day');
</script></body></html>
