function currentSnapshot(){return {phase,channel,retry,start,oldUsable,failure,installJob,installTotal}}
function statusFor(c){

return p==='ready'?{label:'已就绪',action:'使用'}:p==='error'?{label:'遇到问题',action:'查看问题 / 重试'}:p==='login'||['authorize','browser','link','submitting','checking'].includes(p)?{label:'待登录',action:'继续登录'}:p==='canceled'?{label:'已取消',action:'重新安装'}:['preparing','downloading','verifying','stalled','stopping'].includes(p)?{label:'安装中',action:'查看进度'}:{label:'未安装',action:'安装'};
}
function resumeAgent(c){
entryView='';
if(c!==cli&&(busy()||phase==='stalled')){toast('本 Demo 一次演示一个安装任务，请先完成或取消 '+cli+'。');renderEntry();opened=true;render();return}

if(saved){({phase,channel,retry,start,oldUsable,failure,installJob,installTotal}=saved)}
else{phase='idle';installJob=false;retry=false;oldUsable=false;channel='官方安装';}}
opened=true;
if(['idle','skipped'].includes(phase)){choose(c)}
else if(phase==='canceled'){state('confirm')}
else{log('从固定入口返回 '+c+' · '+statusFor(c).label+'；复用当前任务');render()}
}

function turnSnake(x,y){if(x===-direction[0]&&y===-direction[1])return;nextDirection=[x,y]}
function toggleSnake(){if(!gameStarted||gameEnded){resetSnake();gameStarted=true;snakeRunning=true}else snakeRunning=!snakeRunning;paintSnake();$('#snake')?.focus()}
function paintSnake(){const cv=$('#snake');if(!cv)return;const ctx=cv.getContext('2d');ctx.fillStyle='#171717';ctx.fillRect(0,0,320,320);ctx.strokeStyle='#ffffff08';for(let i=0;i<16;i++){ctx.beginPath();ctx.moveTo(i*20,0);ctx.lineTo(i*20,320);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*20);ctx.lineTo(320,i*20);ctx.stroke()}ctx.fillStyle='#fcd34d';ctx.fillRect(food[0]*20+4,food[1]*20+4,12,12);snake.forEach((p,i)=>{ctx.fillStyle=i?'#b4b4b4':'#ececec';ctx.fillRect(p[0]*20+2,p[1]*20+2,16,16)});if(!snakeRunning){ctx.fillStyle='#111a';ctx.fillRect(0,0,320,320);ctx.fillStyle='#eee';ctx.font='15px sans-serif';ctx.textAlign='center';ctx.fillText(gameEnded?'本局结束':gameStarted?'已暂停':'准备好了吗？',160,160)}const control=document.querySelector('[data-action="game-toggle"]');if(control)control.textContent=gameEnded?'再来一局':snakeRunning?'暂停':gameStarted?'继续':'开始';const label=$('#game-score');if(label)label.textContent='得分 '+score}
function tickSnake(){if(!snakeRunning||!opened||!gameShown||!installingNow()||!$('#snake'))return;direction=nextDirection;const head=[snake[0][0]+direction[0],snake[0][1]+direction[1]],eat=head[0]===food[0]&&head[1]===food[1];if(head.some(v=>v<0||v>=16)||snake.slice(0,eat?snake.length:-1).some(p=>p[0]===head[0]&&p[1]===head[1])){snakeRunning=false;gameEnded=true;paintSnake();return}snake.unshift(head);if(eat){score++;const free=[];for(let x=0;x<16;x++)for(let y=0;y<16;y++)if(!snake.some(p=>p[0]===x&&p[1]===y))free.push([x,y]);if(!free.length){snakeRunning=false;gameEnded=true}else food=free[Math.floor(Math.random()*free.length)]}else snake.pop();paintSnake()}
document.addEventListener('keydown',ev=>{if(!opened||!gameShown||!installingNow()||document.activeElement?.tagName==='INPUT'||document.activeElement?.tagName==='TEXTAREA')return;const d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[ev.key];if(d){ev.preventDefault();turnSnake(...d)}});setInterval(tickSnake,180);setInterval(updateFeedback,1000);
reset();
</script></body></html>
