  { n:'阿里云盘', d:'读写网盘文件', c:'storage', i:'☁️', bg:'#ff6a00', auth:1 }
];
let active='feat', q='';
const catName=id=>(CATS.find(c=>c.id===id)||{}).name||'';
function renderNav(){
  const el=document.getElementById('nav'); let h='';
  const count=id=> id==='feat'?P.filter(p=>p.feat).length : id==='installed'?P.filter(p=>p.inst).length : P.filter(p=>p.c===id).length;
  h+='<div class="navg">浏览</div>';
  for(const c of CATS){ if(c.id==='office') h+='<div class="navg">分类</div>';
    h+=`<button class="${active===c.id?'on':''}" data-id="${c.id}"><span class="ci">${c.icon}</span><span class="cn">${c.name}</span><span class="cc">${count(c.id)}</span></button>`; }
  el.innerHTML=h;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ active=b.dataset.id; q=''; document.getElementById('q').value=''; render(); });
}
function iconHtml(p){ return p.logo && L[p.logo] ? `<div class="ic logo">${L[p.logo]}</div>` : `<div class="ic" style="background:${p.bg}22">${p.i}</div>`; }
function card(p){
  const act = p.inst ? '<button class="add done" title="已安装">✓</button>' : '<button class="add" title="接入">＋</button>';
  const tag = p.auth ? '<span class="tag">需登录</span>' : '';
  return `<div class="card">${iconHtml(p)}<div class="cb"><div class="ct"><b>${p.n}</b>${tag}</div><div class="cd">${p.d}</div></div>${act}</div>`;
}
function render(){
  renderNav();
  const body=document.getElementById('body');
  if(q){ const hits=P.filter(p=>(p.n+p.d).toLowerCase().includes(q.toLowerCase()));
    body.innerHTML=`<div class="sech">搜索「${q}」<span class="n">· ${hits.length} 个</span></div>`+(hits.length?`<div class="grid">${hits.map(card).join('')}</div>`:'<div class="empty">没找到，换个词试试</div>'); return; }
  if(active==='feat'){
    let h=`<div class="sech">热门<span class="n">· 装了即用与最常用的</span></div><div class="grid">${P.filter(p=>p.feat).map(card).join('')}</div>`;
    for(const c of CATS.filter(c=>c.id!=='feat'&&c.id!=='installed')){ const list=P.filter(p=>p.c===c.id).slice(0,2);
      if(list.length) h+=`<div class="sech">${c.icon} ${c.name}</div><div class="grid">${list.map(card).join('')}</div>`; }
    body.innerHTML=h; return;
  }
  const list=active==='installed'?P.filter(p=>p.inst):P.filter(p=>p.c===active);
  const title=active==='installed'?'已安装':(CATS.find(c=>c.id===active).icon+' '+catName(active));
  body.innerHTML=`<div class="sech">${title}<span class="n">· ${list.length} 个</span></div>`+(list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">这个分类暂时是空的</div>');
}
document.getElementById('q').addEventListener('input', e=>{ q=e.target.value.trim(); render(); });
render();
</script>
</body></html>
