<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eas-Term · 设置层级视觉稿</title><style>
*{box-sizing:border-box} :root{color-scheme:dark;--text:#e6e7ea;--muted:#92959e;--line:rgba(255,255,255,.075);--panel:rgba(21,23,29,.86)}body{margin:0;background:#090b0f;color:var(--text);font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #bac9e3;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.page{padding:28px 40px;max-width:1380px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{letter-spacing:2px;font-size:12px;color:#a4a7af}.badge{font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;color:#aaaeb8}.caption{margin:0 0 18px;color:var(--muted);font-size:12px}.stage{padding:32px 24px;background:radial-gradient(ellipse at 30% 25%,#262b3444,transparent 58%),radial-gradient(#ffffff12 1px,transparent 1px);background-size:auto,22px 22px;border:1px solid #ffffff08;border-radius:22px}.modal{width:100%;max-width:1060px;height:740px;margin:auto;display:grid;grid-template-columns:214px 1fr;background:var(--panel);border:1px solid #ffffff16;border-radius:20px;box-shadow:inset 0 1px #ffffff12,0 32px 100px #0009;backdrop-filter:blur(28px) saturate(1.6);overflow:hidden}.side{background:#0e10154d;border-right:1px solid var(--line);padding:24px 14px 14px;display:flex;flex-direction:column;min-height:0}.side h1{font-size:21px;letter-spacing:1px;margin:0 12px 18px}.search{position:relative;margin:0 6px 16px}.search input{width:100%;padding:8px 10px 8px 29px;background:#ffffff04;border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px}.search span{position:absolute;top:7px;left:10px;color:var(--muted)}nav{overflow:auto;flex:1}.navgroup{margin:14px 12px 6px;color:#777c88;font-size:10px;letter-spacing:1.5px}.navitem{width:100%;display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid transparent;background:none;border-radius:8px;text-align:left;font-size:12px;color:#a8acb6;margin:2px 0}.navitem:hover{background:#ffffff05;color:white}.navitem.active{background:linear-gradient(110deg,#ffffff12,#ffffff06);color:#fafafa;border-color:#ffffff09;box-shadow:inset 2px 0 #ddd}.ico{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;opacity:.8}.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.version{padding:15px 12px 0;border-top:1px solid var(--line);font-size:10px;color:#777c86;display:flex;justify-content:space-between}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.head{padding:25px 32px 20px;border-bottom:1px solid var(--line);position:relative}.crumb{font-size:10px;letter-spacing:1px;color:#848995;margin-bottom:8px}.head h2{font-size:23px;font-weight:600;letter-spacing:.3px;margin:0 0 5px}.head p{margin:0;color:var(--muted);font-size:12px}.close{position:absolute;right:22px;top:22px;background:none;border:0;color:#858994;font-size:22px}.content{padding:24px 32px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#ffffff1c transparent}h3{font-size:12px;font-weight:600;margin:0 0 10px;display:flex;gap:9px;align-items:center}h3 small{font-weight:400;font-size:10px;color:#7e8390}.group{margin-bottom:22px}.card{border:1px solid var(--line);background:linear-gradient(130deg,#ffffff05,#ffffff01);border-radius:11px;overflow:hidden}.row{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:24px}.row+.row{border-top:1px solid var(--line)}.name{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}.desc{color:var(--muted);font-size:11px;margin-top:4px;max-width:450px;line-height:1.8}.pill{font-size:9px;border:1px solid #ffffff14;border-radius:4px;padding:0 5px;color:#b1b6c1;font-weight:400;white-space:nowrap}.switch{flex:none;width:34px;height:20px;border:1px solid #ffffff14;border-radius:12px;background:#3a3d45;padding:2px;transition:.18s}.switch:before{content:'';display:block;background:#b0b3bb;width:14px;height:14px;border-radius:50%;transition:.18s}.switch[aria-checked=true]{background:#dadce1}.switch[aria-checked=true]:before{transform:translateX(13px);background:#393d46}.btn,select{border:1px solid #ffffff13;border-radius:7px;background:#ffffff05;color:#d0d3db;padding:6px 10px;white-space:nowrap;font-size:11px}.btn:hover{background:#ffffff0d}.primary{background:#dedfe3;color:#22252b;border:0}.primary:hover{background:white}.seg{display:flex;gap:4px;padding:4px;background:#090b102f;border:1px solid var(--line);border-radius:9px}.seg button{flex:1;padding:9px 6px;border:0;background:none;border-radius:6px;color:#8f94a0;font-size:11px}.seg button.selected{background:#ffffff14;color:#eceef2;box-shadow:0 1px 4px #0003}.subblock{padding:0 18px 15px}.warning{border-left:2px solid #a78b5b;margin:12px 0 0;padding-left:10px;color:#c2ad88;font-size:11px}.detail{border-top:1px solid var(--line);padding:10px 18px;color:#8d939f;font-size:11px}summary{cursor:pointer;color:#a8adb7}.detail p{margin:8px 0 2px}.foot{padding:12px 32px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:#787e89;font-size:10px;background:#0e101433}.foot .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#989da8;margin-right:6px}.note{font-size:11px;color:#868d99;margin-top:12px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px}.theme{border:1px solid var(--line);background:none;padding:7px;border-radius:10px;text-align:left}.theme.selected{border-color:#afb5c2}.theme small{display:block;padding:7px 3px 2px}.mini{height:77px;border-radius:5px;background:#11151d;display:flex;padding:7px;gap:6px}.mini:before{content:'';width:23%;background:#ffffff0b;border-radius:3px}.mini:after{content:'';flex:1;border-radius:3px;background:repeating-linear-gradient(0deg,#ffffff0d 0 7px,transparent 7px 14px)}.mini.light{background:#e7e8ec}.mini.light:after,.mini.light:before{background:#aeb3be}.mini.system{background:linear-gradient(90deg,#11151d 50%,#e7e8ec 50%)}.empty{text-align:center;padding:30px;color:#7e8592;font-size:11px}.status{color:#b4c5bb;font-size:11px}.mapping{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:24px}.mapping div{padding:0 14px;border-left:1px solid #ffffff20}.mapping b{font-size:12px;font-weight:500}.mapping p{font-size:11px;color:#808792;margin:5px 0}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#30343e;border:1px solid #ffffff20;border-radius:10px;padding:10px 18px;box-shadow:0 6px 40px #0008;display:none;font-size:12px}kbd{font-size:11px;border:1px solid #ffffff20;padding:4px 7px;border-radius:5px;color:#bbc1cc}input[type=range]{accent-color:#d5d8df;width:130px}@media(max-width:850px){.page{padding:16px}.stage{padding:12px}.modal{grid-template-columns:170px 1fr;height:750px}.head,.content{padding:20px}.row{gap:12px;padding:14px}.mapping{gap:8px}.name{flex-wrap:wrap}}@media(max-width:580px){.modal{grid-template-columns:130px 1fr}.side{padding:18px 7px}.navitem{padding:8px 6px;gap:5px}.head,.content{padding:15px}.row{align-items:flex-start;flex-wrap:wrap}.themes{gap:5px;padding:10px}.mapping{grid-template-columns:1fr}.seg{flex-wrap:wrap}.foot{padding:12px}.search input{font-size:10px}.head h2{font-size:19px}}
</style></head><body><div class="page"><div class="top"><span class="brand">EAS-TERM / SETTINGS</span><span class="badge">视觉提案 01 · 可点击预览</span></div><p class="caption">保留原有玻璃材质，只重建信息层级。所有状态为演示，不读取或修改你的真实设置。</p><div class="stage"><section class="modal" aria-label="设置视觉稿"><aside class="side"><h1>设置</h1><div class="search"><span>⌕</span><input id="search" aria-label="搜索设置" placeholder="搜索设置…"></div><nav id="nav"></nav><div class="version"><span>Eas-Term</span><span>0.4.91</span></div></aside><main class="main"><header class="head"><div class="crumb" id="crumb"></div><h2 id="title"></h2><p id="subtitle"></p><button class="close" aria-label="关闭预览" onclick="toast('这是视觉稿，预览保持打开')">×</button></header><div class="content" id="content"></div><footer class="foot"><span><i class="dot"></i>仅演示交互 · 不写入真实设置</span><span>三级信息层级</span></footer></main></section></div><section class="mapping"><div><b>01 / 分类导航</b><p>体验、AI 与连接、系统管理。用分组取代无差别的页签列表。</p></div><div><b>02 / 任务分区</b><p>一张卡片解决一类问题；审批、额度与 MCP 不再堆在一起。</p></div><div><b>03 / 选项与解释</b><p>标题优先、控件右对齐。风险始终可见，技术细节按需展开。</p></div></section></div><div class="toast" id="toast" role="status"></div><script>
const paths=['M4 4h16v16H4z M4 9h16 M9 9v11','M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z','M9 5L5 9H2v6h3l4 4z M14 8q6 4 0 8','M3 6h18v12H3z M6 10h1m3 0h1m3 0h1m3 0h1M7 14h10','M8 4h8v3h4v12H4V7h4z M8 11h1m6 0h1M9 15h6','M8 3v6m8-6v6M5 9h14v3a7 7 0 01-14 0zM12 19v3','M7 2h10v20H7z M11 18h2','M4 10a8 8 0 0114-5l2 3M20 3v5h-5M20 14a8 8 0 01-14 5l-2-3M4 21v-5h5','M3 16l5-7 4 4 4-9 5 7','M12 2l8 4v7c0 4-8 9-8 9s-8-5-8-9V6z M9 11l2 2 4-4'];
const defs=[['theme','外观','工作体验','配色与界面呈现，让工作台保持熟悉。'],['board','画板','工作体验','管理快照完成后的标记行为。'],['sound','声音与提醒','工作体验','决定哪些时刻需要声音提醒。'],['keys','快捷键','工作体验','按使用场景查找键位，作用域始终可见。'],['ai','AI 对话','AI 与连接','先决定如何协作，再决定如何授权。'],['mcp','MCP 接入','AI 与连接','管理 AI 对工作台的工具调用。'],['phone','手机连接','AI 与连接','连接你的手机，远程查看电脑上的项目。'],['update','更新','系统管理','应用与 AI CLI 的更新分别管理。'],['perf','性能与诊断','系统管理','图形状态与问题排查放在同一个地方。'],['privacy','隐私与扩展','系统管理','清楚知道采集了什么、在本机写入了什么。']];
const sw=(on=true)=>`<button class="switch" role="switch" aria-label="切换演示设置" aria-checked="${on}" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true');toast('仅更新视觉稿中的演示状态')"></button>`;
const btn=(text)=>`<button class="btn" onclick="toast('演示操作：${text}，未执行真实操作')">${text}</button>`;
const row=(name,desc,control='',tag='')=>`<div class="row"><div><div class="name">${name}${tag?`<span class="pill">${tag}</span>`:''}</div><div class="desc">${desc}</div></div>${control}</div>`;
const group=(title,html,meta='')=>`<section class="group"><h3>${title}<small>${meta}</small></h3><div class="card">${html}</div></section>`;
const detail=(title,text)=>`<details class="detail"><summary>${title}</summary><p>${text}</p></details>`;
const seg=(items,sel=0)=>`<div class="seg">${items.map((x,i)=>`<button class="${i===sel?'selected':''}" onclick="this.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');toast('仅更新演示选择')">${x}</button>`).join('')}</div>`;
const pages={
ai:()=>group('协作方式',row('先问再做','修改文件或执行命令前，先说明意图并等待你回复。',sw(true),'提示词约定')+detail('这不是强制审批','通过系统提示约定模型行为，依赖模型遵守；不等于进程级拦截。只读操作照常执行。'))+group('执行权限',row('OMP 工具审批','选择哪些操作必须停下来，由你批准后继续。','<span class="pill">OMP 可用时显示</span>','强制审批')+`<div class="subblock">${seg(['直接执行','全部审批','仅命令审批'],1)}<div class="warning">审批关闭不等于取消安全限制。生成图片、控制浏览器、控制电脑与语音合成仍受既有禁用规则约束。</div></div>`+detail('三个档位分别控制什么','直接执行：不弹出审批卡。全部审批：工具执行前等待批准。仅命令审批：修改文件不审批，仅执行命令审批。这里只重排现有档位，不改变其权限语义。'))+group('额度与上下文',row('读取 Claude 状态栏','读取订阅额度和上下文占用，不与项目用量账本混为一谈。',sw(false),'Claude')+detail('会修改哪些配置？','开启会修改 ~/.claude/settings.json 的 statusLine，写入前备份，包裹而非替换原有状态栏；关闭后还原。')),
theme:()=>group('界面主题',`<div class="themes">${['暗色','亮色','跟随系统'].map((x,i)=>`<button class="theme ${i===0?'selected':''}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected');toast('仅选中主题样卡，未更改应用主题')"><div class="mini ${['','light','system'][i]}"></div><small>${x} ${i===0?'✓':''}</small></button>`).join('')}</div>`)+group('界面元素',row('显示灵动岛','在其他应用中工作时，显示任务状态与待处理提醒。',sw())+detail('何时出现？','回到 Eas-Term 时自动让位，状态由主界面铃铛与抽屉提示承接。关闭后不创建灵动岛窗口。')),
board:()=>group('快照与标记',row('快照后清空标记','只影响拍摄快照后的标记，不调整模块布局。','<select aria-label="快照后清空标记"><option>每次询问</option><option>总是保留</option><option>总是清空</option></select>')),
sound:()=>group('任务提醒',row('播放提示音','任务完成或等待审批时发出提醒。',sw())+row('提醒音量','松开滑块后可试听；关闭提示音时下方控件应禁用。','<input aria-label="提醒音量" type="range" value="65">')+row('试听','选择一种通知声音。',btn('任务完成')+btn('等待审批'))),
mcp:()=>group('工具接入',row('允许 MCP 调用','关闭后，AI 通过 MCP 发来的工具调用会被拒绝。',sw())+detail('影响范围','不修改 ~/.claude.json；保留标题栏的 MCP 状态入口，点击后直达此页。'))+group('最近调用',`<div class="empty">还没有调用记录<br>工具名称、执行结果和时间将在这里显示</div>`,'空状态演示')+`<p class="note">调用记录与接入开关同页；有记录时提供“清空记录”。</p>`,
phone:()=>group('手机端服务',row('允许手机连接','开启后在局域网开放端口；关闭后立即停止，无需重启。',sw(false))+`<div class="empty">服务尚未开启<br>开启后显示连接入口、配对请求与已配对设备</div>`)+group('配对与安全',row('新设备需要批准','配对请求必须在这台电脑上由你点击允许。','<span class="pill">人工确认</span>')),
update:()=>group('Eas-Term',row('当前版本 0.4.91','版本号仅用于视觉演示，未联网检查更新。',btn('检查更新'))+row('自动检查新版本','启动后检查 Eas-Term 是否有可用更新。',sw()))+group('AI CLI', ['Claude Code','Codex','OMP'].map(x=>row(x,'版本与任务状态在运行时读取；当前未检测。','<div style="display:flex;gap:10px;align-items:center">'+sw(false)+btn('检查')+'</div>','未检测')).join(''))+`<p class="note">各 CLI 保留原有自动更新开关、更新中状态与失败重试，不共用应用更新开关。</p>`,
perf:()=>group('图形加速',row('图形状态待检测','显示当前系统、架构与 GPU / 软件合成结论。',btn('复制诊断'))+['图形合成','栅格化','2D 画布'].map(x=>row(x,'以设备实际返回状态为准。','<span class="pill">未检测</span>')).join(''))+group('诊断日志',row('闪烁黑匣子','记录组件重挂、超过 100 ms 的长任务、GPU 与渲染进程重启。',btn('查看事件'))+row('本地日志文件','从原“隐私”页移到此处，查卡顿不用再跨页。',btn('在访达显示'))),
privacy:()=>group('匿名使用统计',row('帮助改进 Eas-Term','只统计使用时长、启动次数、版本、系统大类和功能使用次数。',sw(false))+`<div class="subblock"><div class="warning">这项统计不采集终端正文、命令、文件路径、项目名、AI 对话或密钥。</div></div>`+detail('完整隐私说明','真实实现保留完整隐私说明入口；这里只说明匿名统计边界，不宣称所有 AI 网络请求都不发送对话。'))+group('本机扩展与写入',row('扩展能力清单','列出软件在本机写入的位置、用途与卸载入口。',btn('查看清单'))+detail('卸载操作的层级','逐项展示影响范围；卸载操作与普通开关分离，不放在高频设置旁。此稿不执行卸载。')),
keys:()=>group('画布操作',row('放大画布','仅画布视图','<kbd>⌘ +</kbd>')+row('缩小画布','仅画布视图','<kbd>⌘ −</kbd>'),'示意键位 · 落地从注册表读取')+group('键位编辑',row('点击键位录制','保留 Esc 取消、作用域冲突提示和逐项恢复默认。',btn('演示录制')))+`<p class="note">实际全部键位继续来自 shared/shortcuts.ts，不新增一份手写注册表。</p>`
};
let current='ai';function nav(q=''){let last='';document.getElementById('nav').innerHTML=defs.filter(d=>(d.join(' ')+pages[d[0]]()).toLowerCase().includes(q.toLowerCase())).map(d=>{let h=d[2]!==last?`<div class="navgroup">${d[2]}</div>`:'';last=d[2];return h+`<button class="navitem ${current===d[0]?'active':''}" onclick="show('${d[0]}')"><span class="ico"><svg viewBox="0 0 24 24"><path d="${paths[defs.indexOf(d)]}"/></svg></span>${d[1]}</button>`}).join('')||'<div class="empty">没有匹配的设置</div>'}function show(id){current=id;const d=defs.find(x=>x[0]===id);document.getElementById('crumb').textContent='设置 / '+d[2];document.getElementById('title').textContent=d[1];document.getElementById('subtitle').textContent=d[3];document.getElementById('content').innerHTML=pages[id]();document.getElementById('content').scrollTop=0;nav(document.getElementById('search').value)}let timer;function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(timer);timer=setTimeout(()=>el.style.display='none',2200)}document.getElementById('search').oninput=e=>nav(e.target.value);show('ai');
</script></body></html>
